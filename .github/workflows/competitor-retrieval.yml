# Retrieval-only comparison against LongMemEval-S, with no model and no API key.
#
# ## Why this workflow exists separately from `benchmark.yml`
#
# The benchmark workflow answers questions: it needs a reader, a judge, and a key. This one only asks whether
# each provider's retrieval puts the annotated evidence in front of a reader — so it needs none of the three,
# runs in minutes rather than hours, and can be dispatched after every change to the adapter or the signal.
#
# The two are not interchangeable and the difference is stated in the artifact: no reader means the numbers are
# evidence recall, not answer accuracy, and they must never be quoted as the latter.
#
# ## Why the corpus is fetched here instead of committed
#
# LongMemEval-S is ~115 MB and lives behind HuggingFace. The sandbox this repository is developed in can reach
# `api.github.com` and nothing else, so the only place this tool can meet the real corpus is a runner. That is
# also why the local default is the synthetic generator: the tool has to be runnable by a developer with no
# network at all, and it has to say which corpus it ran on.
name: Competitor Retrieval

on:
  workflow_dispatch:
    inputs:
      questions:
        description: 'Questions to sample round-robin across capabilities (0 = all 500)'
        required: false
        default: '100'
        type: string
      # The second half of a sample whose first half did not fit in one job. `--offset` takes a *block* of the
      # stratified order, so `--questions 50` twice with `--offset 0` and `--offset 50` measures the same hundred
      # questions one call would -- unlike halving the count, which samples a different (and easier to over-read)
      # subset. Run 45002769709 is why this exists: `memcog` needs longer than the job allows for a hundred.
      offset:
        description: 'Questions to skip at the start of the stratified sample, to split one sample across dispatches'
        required: false
        default: '0'
        type: string
      read_questions:
        description: 'Questions to read and grade (0 = skip the reading stage)'
        required: false
        default: '100'
        type: string
      read_arms:
        description: 'Comma-separated provider names to read (empty = the four default arms)'
        required: false
        default: ''
        type: string
      # Three arms at 500 questions is ~270 minutes of model calls and the job is cancelled at the timeout,
      # losing *every* arm rather than the last one. This input exists so the two arms that answer a question can
      # be run without paying for the one that only establishes a baseline already in the log.
      read_prompts:
        description: 'Which reader prompts to run: con, dispatch, dispatch2 (comma-separated)'
        required: false
        default: 'con,dispatch,dispatch2'
        type: string
      limit:
        description: 'Top-k the reader would see'
        required: false
        default: '10'
        type: string
      # The reading stage had no temperature at all until this input existed. Every other workflow that
      # answers questions pins it (benchmark.yml, benchmark-cortex-memory.yml, restore-counterfactual.yml);
      # this one did not, so `createLlmFromEnv` built the reader with `temperature: null` and the request
      # carried no field, which means the provider default served every T1 row ever read. That is the
      # stated cause of H5 failing on run 43178388235: the same control arm read twice moved 13 -> 11.
      # `default` is the sentinel for "send no temperature" (reader-temperature.ts); it is not the default
      # here on purpose, because a run that means to be deterministic should have to say what it is.
      temperature:
        description: 'Sampling temperature for the reading stage; `default` sends no field and lets the provider decide'
        required: false
        default: '0'
        type: string
      sut:
        description: 'System under test to run as one more arm (empty = none; `mem0` and `letta` run their own code, `reference` is the offline floor). `letta` installs the archived V1 server at tag 0.16.8 rather than `pip install letta`, which now resolves to Letta Code — a different product — see tools/competitor-sut/PROTOCOL.md'
        required: false
        default: ''
        type: string
      # A content-addressed cache between the competitor and the embedding endpoint. `tools/competitor-sut/
      # embed_cache_proxy.py` states the mechanism and `03` section 14.130 the criteria; the reason it exists is
      # that this workflow ingests the same haystack FOUR times per dispatch (once for the system-under-test step and
      # once per reading prompt) and the haystack reuses sessions across questions, so the same text is embedded and
      # paid for repeatedly. The vectors are the endpoint's own and are returned unchanged, so what the system under
      # test sees does not change -- criterion 3 of 14.130 is that with and without the cache the reader's answers
      # are identical question by question, and `openai` is the control for it.
      sut_embed_cache:
        description: 'Embedder for `mem0`/`letta`: openai-cached (transparent cache in front of the endpoint) or openai (the control)'
        required: false
        default: 'openai-cached'
        type: string
      sut_infer:
        description: 'For `mem0`: 1 runs its LLM extraction at ingest (one model call per turn, ~275k on 500 questions) — 0 stores turns as given'
        required: false
        default: '0'
      # The model every system's own calls go to. It is a separate input from `DEEPSEEK_MODEL`, which names the
      # *reader*, because the point of the run is that the two are the same and a reader has to be able to see that
      # they were set independently and still agreed.
      sut_llm:
        description: 'Model id for the systems under test (Mem0 extraction, MemCog build+navigation, Mastra Observer/Reflector); empty = the same id as the reader'
        required: false
        default: ''
        type: string
      # Mastra's unobserved-token trigger, which is the one knob that changes whether its arm compresses at all. At its
      # own default (30k) the answering call measured a 112k median prompt on a 115k-token haystack -- the agent read
      # the transcript plus an observation log that had grown to the size of the corpus, so "observational memory"
      # bought no context savings to compare against. Lowering it is the experiment that makes the comparison fair:
      # the same mechanism inside Cortex's own 33k prompt budget, which is the only envelope where accuracy per token
      # is a question with an answer. Empty = the vendor default.
      sut_mastra_message_tokens:
        description: 'For `mastra`: the `observation.messageTokens` trigger; empty = the vendor default of 30,000'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  # Grouped per system under test, because this workflow is dispatch-only and the thing a repeat dispatch has to
  # cancel is the *same arm's* previous run: a second `sut=memcog` replaces the first rather than queueing behind an
  # hour of it. Grouping only on the ref made the three arms mutually exclusive -- dispatching `mastra` while
  # `memcog` was measuring cancelled MemCog mid-ingest, which is how run 45002769709 died a second time.
  group: competitor-retrieval-${{ github.ref }}-${{ inputs.sut || 'none' }}
  cancel-in-progress: true

jobs:
  retrieval:
    runs-on: ubuntu-22.04
    # Dispatch inputs enter through the environment, never through the script text.
    #
    # `§13.161`'s eleventh recurrence was the other spelling, one file over: an input interpolated
    # into a `run:` block is substituted by the runner BEFORE bash parses the block, so a value
    # containing a quote or a `;` changes the program rather than a variable. Declared here, the
    # value reaches bash as data and `--questions "$QUESTIONS"` cannot be anything else. The defaults
    # live here rather than at every use site, so there is one place a missing input can be wrong.
    env:
      QUESTIONS: ${{ github.event.inputs.questions || '100' }}
      LIMIT: ${{ github.event.inputs.limit || '10' }}
      OFFSET: ${{ github.event.inputs.offset || '0' }}
      READ_QUESTIONS: ${{ github.event.inputs.read_questions || '100' }}
      TEMPERATURE: ${{ github.event.inputs.temperature || '0' }}
      MEM0_EMBEDDER: ${{ github.event.inputs.sut_embed_cache || 'openai-cached' }}
      MEM0_EMBED_CACHE_PATH: ${{ github.workspace }}/.cache/competitor-embed/embeddings.sqlite
      # §14.132. Every model call a system under test makes goes to the metering proxy, so "the same LLM" is a base
      # URL rather than a claim, and the token column comes back from the provider's own `usage`. These belong to the
      # job rather than to each step: they were declared per step, and the ingest step was missing the ones the three
      # reading steps had. That is how `MASTRA_STORE` came to name a directory no step created -- the ingest fell back
      # to `/tmp` and every reading stage died at import with `SQLITE_CANTOPEN`, reported as success because the
      # step piped a dead process into `tee`. One definition, so a new step cannot inherit four of five variables.
      SUT_LLM_BASE_URL: http://127.0.0.1:8399/v1
      SUT_LLM_MODEL: ${{ github.event.inputs.sut_llm || vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
      MEM0_LLM_BASE_URL: http://127.0.0.1:8399/v1
      MEMCOG_VENDOR: ${{ github.workspace }}/tools/competitor-sut/.vendor/MemCog
      MASTRA_STORE: ${{ github.workspace }}/.cache/mastra/store.db
      # Empty when the input is blank, which the driver reads as the vendor default rather than as a zero trigger.
      MASTRA_MESSAGE_TOKENS: ${{ github.event.inputs.sut_mastra_message_tokens }}
    # 500 questions x 2 arms x 2 calls per arm is ~2,000 calls for ONE reading arm, and this workflow now runs
    # three of them. The measured cost of the first arm alone was about 45 minutes on a runner, so 120 was already
    # marginal and three arms made it a coin flip. Raised rather than cutting the question count: a 500-question
    # reading is the only one whose temporal column has enough questions for a paired test, which is the whole
    # reason the arms exist.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The competitor's own package, installed only when one was asked for. `faiss-cpu` because Mem0's local store
      # needs it and a server store would add a service to start; neither is in the repository's own dependencies,
      # which is the point of a process boundary.
      - name: Install the system under test
        if: inputs.sut == 'mem0'
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "mem0ai==2.2.1" faiss-cpu
          python3 -c 'import mem0, faiss; print("mem0", mem0.__version__, "faiss ok")'

      # §13.304. Letta is installed **by tag**, and that is not a preference.
      #
      # `pip install letta` resolves to 0.34.12 today — Letta Code, a terminal agent whose module is `letta_code`
      # — and `letta-ai/letta`'s `main` branch is fifteen documentation files pointing at `letta-code`, with the V1
      # API server retired to the `archive` branch. The only tree that contains the server MemStrata ran as a
      # matched-reader arm (438/500) is the tag below, so the tag is what gets installed. A run of the successor
      # product would produce a number filed under the archived one's name, which is the failure
      # `tools/competitor-sut/PROTOCOL.md` ("Resolution: the name is not the product") exists to prevent.
      - name: Install the system under test (letta, pinned to the measured server)
        if: inputs.sut == 'letta'
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "letta @ git+https://github.com/letta-ai/letta@0.16.8"
          python3 -c 'import letta.server.rest_api.app; print("letta V1 server present")'

      # The server, then a health check that fails the job rather than the measurement.
      #
      # `build: embedding` is only true if the arm never routes a request through an agent: the driver uses
      # archives (`/v1/archives/...`) and the passage search route, so passages are embedded and no model is asked
      # anything. `OPENAI_API_KEY` is the Zhipu key because Letta's OpenAI embedding client reads the key from that
      # variable and takes its base URL from the archive's `embedding_config` — which is the vector space every
      # other arm in this repository reads the corpus in.
      - name: Start the archived Letta server
        if: inputs.sut == 'letta'
        env:
          OPENAI_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          set -o pipefail
          letta server --port 8283 > letta-server.log 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8283/v1/health > /dev/null; then
              echo "letta server up after ${attempt} attempt(s)"
              curl -fsS http://127.0.0.1:8283/v1/health
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "the server exited before answering; its log follows"
              tail -n 200 letta-server.log
              exit 1
            fi
            sleep 2
          done
          echo "the server did not answer /v1/health within 180 seconds; its log follows"
          tail -n 200 letta-server.log
          exit 1

      # §14.132. MemCog and Mastra are the two systems whose retrieval *is* their reasoning, so they answer rather
      # than retrieve, and the protocol grew an optional `answer` operation for them. Both are vendored at a commit
      # and a version rather than installed by name, because neither name resolves to a runnable system: MemCog has
      # no PyPI package and ships an LLM client whose body is commented out, and Mastra is a framework whose memory
      # behaviour is a function of four separate package versions.
      - name: Install the system under test (memcog, vendored at a commit)
        if: inputs.sut == 'memcog'
        run: |
          set -o pipefail
          git clone --quiet https://github.com/WeAgentAI/MemCog.git tools/competitor-sut/.vendor/MemCog
          cd tools/competitor-sut/.vendor/MemCog
          # Pinned. `main` moved after the paper, and a number from a later tree is a number about a later system.
          git checkout --quiet fff97b2d4190
          git rev-parse HEAD

          # §14.133. MemCog does not import on Python 3.11, and the error is a syntax error rather than a version
          # check: `store_build/sources.py:75` puts a backslash inside an f-string replacement field, which PEP 701
          # legalised in 3.12. The repository states no minimum version. A dispatch on 3.11 spent its whole duration
          # on `manifest produced no response` -- a broken version assumption, reported as a broken driver.
          #
          # Installed side by side instead of replacing the job's Python, because every other step here is measured
          # on 3.11 and changing the interpreter for the job would be a second variable inside a comparison.
          python3 -m pip install --quiet uv
          # A venv, not a bare `uv python install`: the standalone interpreter uv downloads is marked externally
          # managed and refuses `pip install` into itself. The venv is also the right isolation story -- the driver
          # is a subprocess and nothing else in this job imports these packages.
          uv venv --python 3.12 "$RUNNER_TEMP/memcog-venv"
          MEMCOG_PYTHON="$RUNNER_TEMP/memcog-venv/bin/python"
          echo "MEMCOG_PYTHON=$MEMCOG_PYTHON" >> "$GITHUB_ENV"
          # The package's own dependencies, into the interpreter the driver re-execs into. `openai` is what the
          # authors' commented-out example uses; `requests` is imported by the client module whether or not its body
          # runs.
          uv pip install --python "$MEMCOG_PYTHON" --quiet openai requests
          echo "memcog interpreter: $MEMCOG_PYTHON ($("$MEMCOG_PYTHON" -c 'import sys; print(sys.version.split()[0])'))"
          "$MEMCOG_PYTHON" -c "import sys; sys.path.insert(0, 'src'); import core.llm_client; print('memcog importable')"

      # Mastra's dependency tree is 174 packages and lives in its own package.json under `tools/competitor-sut/`,
      # deliberately outside the workspace lockfile: every install in this repository would otherwise pay for a
      # framework that exactly one dispatch uses.
      - name: Install the system under test (mastra, exact versions)
        if: inputs.sut == 'mastra'
        run: |
          set -o pipefail
          npm install --prefix tools/competitor-sut --no-audit --no-fund
          # Printed because the driver's manifest quotes them, and a manifest that disagreed with the tree would be
          # a version number about a different system.
          node --input-type=module -e "
            import { createRequire } from 'node:module';
            const require = createRequire(process.cwd() + '/tools/competitor-sut/package.json');
            console.log('@mastra/memory', require('@mastra/memory/package.json').version);
            console.log('@mastra/core  ', require('@mastra/core/package.json').version);
          "

      # The MemCog round trip, on the interpreter the driver re-execs into. The unit suite covers the driver's
      # protocol layer against a stand-in, but it cannot cover *this* tree on *this* version: the package does not
      # import below 3.12 and the test runner is 3.11, so the end-to-end tests skip there and this step is what
      # actually proves the vendored checkout parses, imports and answers a manifest.
      - name: MemCog protocol smoke (manifest only, no model call)
        if: inputs.sut == 'memcog'
        env:
          MEMCOG_VENDOR: ${{ github.workspace }}/tools/competitor-sut/.vendor/MemCog
        run: |
          set -o pipefail
          printf '{"op":"manifest"}\n{"op":"shutdown"}\n' | "$MEMCOG_PYTHON" tools/competitor-sut/memcog_driver.py > memcog-manifest.json
          cat memcog-manifest.json
          # The payload arrives on stdin rather than in a `-c` argument. Two reasons, and the first one is why this
          # step failed to parse once: a `-c` body has to start at column zero to avoid carrying the file's own
          # indentation into the program, and a line at column zero terminates the block scalar -- a YAML error
          # reported against the *step*, not against the check. A quoted here-doc is also what the
          # shell-interpolation guard (`docs/OPS-SHELL-INTERPOLATION.md`) requires for an interpreter payload, and
          # YAML strips the block indentation before the shell ever sees the terminator.
          "$MEMCOG_PYTHON" - <<'PY'
          import json, sys
          manifest = [json.loads(line) for line in open('memcog-manifest.json', encoding='utf-8') if line.strip()][0]
          checks = {
              'name': manifest.get('name') == 'memcog',
              'answers': manifest.get('answers') is True,
              'build': manifest.get('build') == 'llm',
              'version': str(manifest.get('version', '')).startswith('vendor@'),
              'versionSource': manifest.get('versionSource') == 'git',
              'model': bool((manifest.get('llm') or {}).get('model')),
          }
          bad = [name for name, ok in checks.items() if not ok]
          if bad:
              sys.exit('bad manifest fields: ' + ', '.join(bad))
          print('memcog manifest ok:', manifest['version'], manifest['llm']['model'])
          PY

      # A protocol round trip that needs no key and no model, run against the *installed* tree rather than against a
      # stub: it proves the four packages import, that the driver starts under the same Node the job uses, and that
      # it declares itself as a self-answering `llm` build. The unit tests cannot cover this -- they run where the 174
      # packages are deliberately not installed -- so it lives here, next to the install it depends on.
      - name: Mastra protocol smoke (manifest only, no model call)
        if: inputs.sut == 'mastra'
        run: |
          set -o pipefail
          printf '{"op":"manifest"}\n{"op":"shutdown"}\n' | node tools/competitor-sut/mastra_driver.mjs > mastra-manifest.json
          cat mastra-manifest.json
          node -e "
            const lines = require('node:fs').readFileSync('mastra-manifest.json', 'utf8').trim().split('\n').map(JSON.parse);
            const manifest = lines[0];
            if (manifest.name !== 'mastra') throw new Error('name is ' + manifest.name);
            if (manifest.answers !== true) throw new Error('does not declare answers:true');
            if (manifest.build !== 'llm') throw new Error('build is ' + manifest.build);
            if (typeof manifest.version !== 'string' || !manifest.version.startsWith('@mastra/memory@')) {
              throw new Error('version does not name the package: ' + manifest.version);
            }
            if (!manifest.llm || !manifest.llm.model) throw new Error('manifest names no model');
            console.log('mastra manifest ok:', manifest.version, manifest.llm.model);
          "

      # The one door every system's model calls go through, so "the same LLM" is a base URL and the token column is
      # the provider's own accounting rather than a request count multiplied by an estimate. Started before the
      # reading stage and left running for the whole job; the cost step reads its `/stats` at the end.
      - name: Start the metering proxy
        if: inputs.sut == 'memcog' || inputs.sut == 'mastra' || inputs.sut == 'mem0'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -o pipefail
          export UPSTREAM_BASE_URL="${SUT_LLM_UPSTREAM:-https://api.deepseek.com}"
          export UPSTREAM_API_KEY="$DEEPSEEK_API_KEY"
          export SUT_LLM_LOG="${{ github.workspace }}/sut-llm-calls.jsonl"
          nohup python3 tools/competitor-sut/sut_llm_proxy.py > sut-llm-proxy.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8399/health > /dev/null; then
              echo "proxy up after ${attempt} attempt(s)"
              curl -fsS http://127.0.0.1:8399/health
              exit 0
            fi
            sleep 1
          done
          echo "the proxy did not answer /health within 30 seconds; its log follows"
          cat sut-llm-proxy.log
          exit 1

      - name: Download LongMemEval-S
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Paths through the environment rather than `process.argv`, because the programs below arrive on stdin: the
          # shell-interpolation guard (`docs/OPS-SHELL-INTERPOLATION.md`) requires a quoted here-doc for an interpreter
          # payload, and a here-doc has no argv to pass.
          CORPUS: ${{ github.workspace }}/data/longmemeval_s_cleaned.json
          DIGEST: ${{ github.workspace }}/data/dataset.sha256
        run: |
          mkdir -p "${{ github.workspace }}/data"
          curl -fL --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            -o "$CORPUS" \
            "https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const rows = JSON.parse(readFileSync(process.env.CORPUS, 'utf8'));
          if (!Array.isArray(rows) || rows.length === 0) {
            console.error('the corpus is not a non-empty JSON array');
            process.exit(1);
          }
          const annotated = rows.filter(
            (row) => Array.isArray(row.answer_session_ids) && row.answer_session_ids.length > 0,
          );
          console.log(`instances: ${rows.length}, with annotated gold: ${annotated.length}`);
          if (annotated.length === 0) {
            console.error('no instance carries answer_session_ids; every question would be unmeasurable');
            process.exit(1);
          }
          NODE
          # A 64-byte digest, because `hashFiles` is evaluated by the template service under a 120-second budget
          # for the whole template and the corpus is 100+ MB. Keying on the corpus itself is the failure
          # `test_embedding_cache_key.py` pins: run 41842684629 died in three minutes with no measurement.
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const digest = createHash('sha256').update(readFileSync(process.env.CORPUS)).digest('hex');
          writeFileSync(process.env.DIGEST, digest + '\n');
          console.log(`corpus sha256 ${digest}`);
          NODE

      # The cache is carried between dispatches, because the saving is not only within one run.
      #
      # Four ingests happen per dispatch: one for the system-under-test step and one per reading prompt, and each is
      # a separate process that builds its own store. Against a cold cache the second, third and fourth re-embed the
      # same haystack for nothing. Keyed on the system under test and the corpus digest rather than on the run, so a
      # re-dispatch after a code change reuses it while a different competitor or a new corpus does not.
      #
      # `restore-keys` is what makes the first dispatch of a new key cheaper: a partial cache stops at the first
      # missing text and the rest is embedded once.
      - name: Restore the embedder cache
        if: github.event.inputs.sut != '' && (github.event.inputs.sut_embed_cache || 'openai-cached') == 'openai-cached'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/competitor-embed
          key: competitor-embed-${{ github.event.inputs.sut }}-${{ hashFiles('data/dataset.sha256') }}
          restore-keys: |
            competitor-embed-${{ github.event.inputs.sut }}-

      - name: Create the embedder cache directory
        if: github.event.inputs.sut != ''
        run: mkdir -p "${{ github.workspace }}/.cache/competitor-embed"

      # Two tables, deliberately: 100 questions is the H1 subset and 500 is the whole file. Running both costs
      # one extra pass and removes the question of whether a reading came from the sample or the population.
      - name: Compare providers (sample)
        env:
          LONGMEMEVAL_PATH: ${{ github.workspace }}/data/longmemeval_s_cleaned.json
        run: |
          # A pipeline reports the exit status of its last command, so `node ... | tee` turns a crashed
          # harness into a green step with a zero-byte artifact. That is how three reading stages
          # that died at import (SQLITE_CANTOPEN) were reported as success in run 45011910491.
          set -o pipefail
          node tools/competitor-harness.mjs \
            --data "$LONGMEMEVAL_PATH" \
            --questions "$QUESTIONS" \
            --limit "$LIMIT" \
            | tee competitor-sample.txt
          node tools/competitor-harness.mjs \
            --data "$LONGMEMEVAL_PATH" \
            --questions "$QUESTIONS" \
            --limit "$LIMIT" \
            --json > competitor-sample.json

      # The system under test. Its own code, our data, our top-k and our embedding space, so the row is a
      # comparison rather than a quotation: the repository's own arms are in the same table, measured in the same
      # invocation, on the same corpus.
      #
      # Cost is why this is a separate step rather than a flag on the two above: a `llm`-build system multiplies
      # the ingest by the number of questions, and the budget sweep above runs three times.
      - name: Compare against the system under test
        if: github.event.inputs.sut != ''
        env:
          LONGMEMEVAL_PATH: ${{ github.workspace }}/data/longmemeval_s_cleaned.json
          SUT: ${{ github.event.inputs.sut }}
          MEM0_INFER: ${{ github.event.inputs.sut_infer || '0' }}
          # The driver's embedder. Zhipu's `embedding-3` through Mem0's own OpenAI client, so the competitor reads
          # the corpus in the same vector space the repository's arms do.
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          # For `letta`: the server was started above on this port, and the batch is 32 because that is the batch
          # the repository's own embedding client uses — a competitor read in a different request shape would be a
          # second variable inside the arm that is supposed to vary only the store.
          LETTA_BASE_URL: http://127.0.0.1:8283
          LETTA_PASSAGE_BATCH: '32'
          # Only read, to answer one question: will a reading stage measure this same system under test? If it will,
          # the ingest below is paid for twice, because the protocol runs `mode: isolated` and every stage starts
          # from an empty store.
          READ_ARMS_INPUT: ${{ github.event.inputs.read_arms }}
        run: |
          # A pipeline reports the exit status of its last command, so `node ... | tee` turns a crashed
          # harness into a green step with a zero-byte artifact. That is how three reading stages
          # that died at import (SQLITE_CANTOPEN) were reported as success in run 45011910491.
          set -o pipefail
          # The reading stage re-launches this driver and ingests the same corpus again, and its row carries the
          # same recall columns this stage exists to produce: `competitor-read.json` records `recallAtK`,
          # `recallAllAtK` and `mrr` for the system under test, at the same top-k, because `--budget-tokens` trims
          # only this repository's own arms. So a dispatch that reads is paying for the ingest twice — run
          # 45011905117 spent 39 minutes and ¥6.71 here and rebuilt the same two stores immediately afterwards.
          # Skipped rather than deleted: a retrieval-only dispatch (`read_questions=0`) still needs this stage, and
          # so does one whose arm list names systems other than this one, which is what the guard below checks.
          if [ "$READ_QUESTIONS" != "0" ]; then
            case ",${READ_ARMS_INPUT}," in
              ,,* | *",${SUT},"*)
                echo "skipped: the reading stage measures ${SUT} at the same top-k and re-ingests it anyway;" \
                  "its recall columns are in competitor-read*.json" \
                  | tee "competitor-sut-$(echo "$SUT" | tr '/' '-').txt"
                exit 0
                ;;
            esac
          fi
          # `2>&1`, because the progress lines the harness prints per question and the vendor package's own
          # build output both go to stderr. Run 45002769709 piped only stdout into this file, so a step that ran
          # thirty-six minutes left an **empty** artifact: the table is printed when the last question is graded,
          # and the only thing that could have said why it never got there was going to stderr.
          node tools/competitor-harness.mjs \
            --data "$LONGMEMEVAL_PATH" \
            --questions "$QUESTIONS" \
            --offset "$OFFSET" \
            --limit "$LIMIT" \
            --sut "$SUT" \
            2>&1 | tee "competitor-sut-$(echo "$SUT" | tr '/' '-').txt"

      # The budget sweep. The published systems report one number each at a different context cost --
      # Contextier 91.6% at 2,807 mean tokens, Zep 90.2% at 4,408 median, Mem0 93.4% at 6,787 mean -- so a single
      # budget here would produce a number that cannot be placed beside any of them. Three rows, one per published
      # budget, is the smallest sweep that answers "at what cost" rather than "how high".
      # Gated on the sample size, because the three-budget sweep is 1,500 questions' worth of the repository's own
      # retrieval and it exists to answer "at what cost", not "how high". A four-question smoke run was spending more
      # wall clock here than on everything else together, and the step's own output is unreadable at n=4 anyway.
      - name: Compare providers (full file, budget sweep)
        if: ${{ github.event.inputs.questions == '0' || fromJSON(github.event.inputs.questions || '100') >= 100 }}
        env:
          LONGMEMEVAL_PATH: ${{ github.workspace }}/data/longmemeval_s_cleaned.json
        run: |
          # A pipeline reports the exit status of its last command, so `node ... | tee` turns a crashed
          # harness into a green step with a zero-byte artifact. That is how three reading stages
          # that died at import (SQLITE_CANTOPEN) were reported as success in run 45011910491.
          set -o pipefail
          : > competitor-full.txt
          for tokens in 2800 4400 6800; do
            echo "=== --budget-tokens $tokens ===" | tee -a competitor-full.txt
            node tools/competitor-harness.mjs \
              --data "$LONGMEMEVAL_PATH" \
              --questions 500 \
              --limit "$LIMIT" \
              --budget-tokens "$tokens" \
              | tee -a competitor-full.txt
          done

      # The reading stage. This is the only step that needs a model: it answers each question from the retrieved
      # context with a Chain-of-Note prompt and grades the answer with the official per-type templates. Without it
      # the table reports evidence recall, which is an upper bound on accuracy rather than accuracy -- and the
      # published systems report accuracy, so no comparison is possible until this runs.
      #
      # Four arms only, and 100 questions: the cost is questions x arms x 2 model calls, and the arms left out are
      # the ones whose accuracy the recall column already determines.
      - name: Read and grade (2.8k budget)
        if: ${{ github.event.inputs.read_questions != '0' && contains(format(',{0},', github.event.inputs.read_prompts || 'con,dispatch,dispatch2'), ',con,') }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LONGMEMEVAL_PATH: ${{ github.workspace }}/data/longmemeval_s_cleaned.json
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          ARMS_FLAG: ${{ github.event.inputs.read_arms != '' && format('--read-arms {0}', github.event.inputs.read_arms) || '' }}
          SUT: ${{ github.event.inputs.sut }}
          MEM0_INFER: ${{ github.event.inputs.sut_infer || '0' }}
          # The competitor's own process has to be startable in the reading stage too. It is a second process:
          # `--read-arms mem0` in an invocation that never launched mem0 matches no provider and reads nothing,
          # which is what run 43170314351 did -- its retrieval table carried mem0 at 100.0% recall and its reading
          # table carried no mem0 row at all, so the only A-grade arm in the run was silently absent.
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          # A pipeline reports the exit status of its last command, so `node ... | tee` turns a crashed
          # harness into a green step with a zero-byte artifact. That is how three reading stages
          # that died at import (SQLITE_CANTOPEN) were reported as success in run 45011910491.
          set -o pipefail
          if [ "$READ_QUESTIONS" = "0" ]; then
            echo "reading stage skipped by input"
            exit 0
          fi
          ARMS="${ARMS_FLAG}"
          # Empty when no system under test was asked for, because `--sut ""` is an error rather than "none".
          SUT_ARG=""
          if [ -n "$SUT" ]; then SUT_ARG="--sut $SUT"; fi
          # One invocation, two outputs. Running it twice -- once for the JSON and once for the table -- produced an
          # artifact and a printed table from two different samples that disagreed by five questions per arm, which
          # is why `--json-out` exists.
          node tools/competitor-harness.mjs \
            --data "$LONGMEMEVAL_PATH" \
            --questions "$READ_QUESTIONS" \
            --limit 10 \
            --budget-tokens 2800 \
            --read $ARMS \
            $SUT_ARG \
            --json-out competitor-read.json \
            | tee competitor-read.txt

      # The dispatch arm. Same hits, same judge, same corpus -- one prompt differs by an inserted per-capability
      # clause. The first reading answered 11 of 20 temporal questions whose evidence had been retrieved 20 of 20
      # times, and three published lines of work (TReMu, MemFlow, Test of Time) say the omission is dates,
      # arithmetic and block order. This is the smallest run that can confirm or refute that.
      - name: Read and grade with the dispatch prompt
        if: ${{ github.event.inputs.read_questions != '0' && contains(format(',{0},', github.event.inputs.read_prompts || 'con,dispatch,dispatch2'), ',dispatch,') }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LONGMEMEVAL_PATH: ${{ github.workspace }}/data/longmemeval_s_cleaned.json
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          ARMS_FLAG: ${{ github.event.inputs.read_arms != '' && format('--read-arms {0}', github.event.inputs.read_arms) || '' }}
          SUT: ${{ github.event.inputs.sut }}
          MEM0_INFER: ${{ github.event.inputs.sut_infer || '0' }}
          # The competitor's own process has to be startable in the reading stage too. It is a second process:
          # `--read-arms mem0` in an invocation that never launched mem0 matches no provider and reads nothing,
          # which is what run 43170314351 did -- its retrieval table carried mem0 at 100.0% recall and its reading
          # table carried no mem0 row at all, so the only A-grade arm in the run was silently absent.
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          # A pipeline reports the exit status of its last command, so `node ... | tee` turns a crashed
          # harness into a green step with a zero-byte artifact. That is how three reading stages
          # that died at import (SQLITE_CANTOPEN) were reported as success in run 45011910491.
          set -o pipefail
          # Empty when no system under test was asked for, because `--sut ""` is an error rather than "none".
          SUT_ARG=""
          if [ -n "$SUT" ]; then SUT_ARG="--sut $SUT"; fi
          node tools/competitor-harness.mjs \
            --data "$LONGMEMEVAL_PATH" \
            --questions "$READ_QUESTIONS" \
            --limit 10 \
            --budget-tokens 2800 \
            --read \
            --reader dispatch \
            --json-out competitor-read-dispatch.json \
            $ARMS_FLAG \
            $SUT_ARG \
            | tee competitor-read-dispatch.txt

      # The multi-session rewrite. `dispatch` says "collect every block and do not stop at the first"; `dispatch2`
      # says what rows to write. The 500-question reading measured the first at 53->58 and 57->55 against the
      # temporal clause's 58->89 and 60->89, so the question is whether naming an artefact is what the shock
      # family needed. The two arms are byte-identical on every other capability (asserted in the reader tests),
      # so this run moves exactly one clause.
      - name: Read and grade with the multi-session rewrite
        if: ${{ github.event.inputs.read_questions != '0' && contains(format(',{0},', github.event.inputs.read_prompts || 'con,dispatch,dispatch2'), ',dispatch2,') }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LONGMEMEVAL_PATH: ${{ github.workspace }}/data/longmemeval_s_cleaned.json
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          ARMS_FLAG: ${{ github.event.inputs.read_arms != '' && format('--read-arms {0}', github.event.inputs.read_arms) || '' }}
          SUT: ${{ github.event.inputs.sut }}
          MEM0_INFER: ${{ github.event.inputs.sut_infer || '0' }}
          # The competitor's own process has to be startable in the reading stage too. It is a second process:
          # `--read-arms mem0` in an invocation that never launched mem0 matches no provider and reads nothing,
          # which is what run 43170314351 did -- its retrieval table carried mem0 at 100.0% recall and its reading
          # table carried no mem0 row at all, so the only A-grade arm in the run was silently absent.
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          # A pipeline reports the exit status of its last command, so `node ... | tee` turns a crashed
          # harness into a green step with a zero-byte artifact. That is how three reading stages
          # that died at import (SQLITE_CANTOPEN) were reported as success in run 45011910491.
          set -o pipefail
          # Empty when no system under test was asked for, because `--sut ""` is an error rather than "none".
          SUT_ARG=""
          if [ -n "$SUT" ]; then SUT_ARG="--sut $SUT"; fi
          node tools/competitor-harness.mjs \
            --data "$LONGMEMEVAL_PATH" \
            --questions "$READ_QUESTIONS" \
            --limit 10 \
            --budget-tokens 2800 \
            --read \
            --reader dispatch2 \
            --json-out competitor-read-dispatch2.json \
            $ARMS_FLAG \
            $SUT_ARG \
            | tee competitor-read-dispatch2.txt

      # Paired tests over the three arms. Without this the run reports three totals and a reader has to decide
      # whether 69.0 against 69.2 is a difference; with it the answer is an exact McNemar p on the discordant
      # questions, and it is the same computation every time. Both files carry one record per measured question,
      # including the questions neither arm got right, because those are the denominator.
      - name: Paired tests across the three arms
        if: ${{ always() && github.event.inputs.read_questions != '0' }}
        run: |
          # A pipeline reports the exit status of its last command, so `node ... | tee` turns a crashed
          # harness into a green step with a zero-byte artifact. That is how three reading stages
          # that died at import (SQLITE_CANTOPEN) were reported as success in run 45011910491.
          set -o pipefail
          set -e
          # The pairs that can be run given which arms were selected. `con->dispatch` needs the control file,
          # which a `read_prompts=dispatch,dispatch2` dispatch does not produce; the loop reports that rather
          # than skipping silently, because "no paired test" and "no difference" are different statements.
          for pair in "competitor-read.json competitor-read-dispatch.json con->dispatch" \
                      "competitor-read-dispatch.json competitor-read-dispatch2.json dispatch->dispatch2"; do
            set -- $pair
            if [ -f "$1" ] && [ -f "$2" ]; then
              echo "=== $3 ==="
              node tools/paired-test.mjs "$1" "$2" | tee -a competitor-paired.txt
              echo
            else
              echo "=== $3: skipped, a run file is missing ===" | tee -a competitor-paired.txt
            fi
          done

      # The pairing the step above cannot express: two *systems* answering the same questions in one run. That
      # step pairs one arm across two prompt shapes, so every line it can print has the same provider on both
      # sides -- the right test for a prompt change and the wrong one for a competitor, where the two sides are
      # different systems by definition. Run 43216630823 is why this exists: its two lines both read
      # `skipped, a run file is missing`, no arm was compared, and the six-point gap between `cortex-session`
      # (65/100) and `mem0` (59/100) stayed a hand computation until someone did it in a shell.
      - name: Paired tests across the arms in one run
        if: ${{ always() && github.event.inputs.read_questions != '0' }}
        run: |
          # A pipeline reports the exit status of its last command, so `node ... | tee` turns a crashed
          # harness into a green step with a zero-byte artifact. That is how three reading stages
          # that died at import (SQLITE_CANTOPEN) were reported as success in run 45011910491.
          set -o pipefail
          if [ -f competitor-read.json ]; then
            echo '=== arms in competitor-read.json ===' | tee -a competitor-paired.txt
            node tools/paired-test.mjs --within competitor-read.json | tee -a competitor-paired.txt
            echo
          else
            echo '=== arms: skipped, the reading stage wrote no json ===' | tee -a competitor-paired.txt
          fi

      # The two columns a vendor table never shows together: what it scored, and what it spent doing so. The stats
      # file is the proxy's own accounting, kept beside the reading so a money number in a report can be traced to a
      # response the provider produced.
      - name: Cost and accuracy
        if: ${{ always() && github.event.inputs.read_questions != '0' && github.event.inputs.sut != '' }}
        run: |
          # A pipeline reports the exit status of its last command, so `node ... | tee` turns a crashed
          # harness into a green step with a zero-byte artifact. That is how three reading stages
          # that died at import (SQLITE_CANTOPEN) were reported as success in run 45011910491.
          set -o pipefail
          curl -fsS "http://127.0.0.1:8399/stats" > sut-llm-stats.json || echo '{}' > sut-llm-stats.json
          cat sut-llm-stats.json | head -c 2000
          echo
          if [ -f competitor-read.json ]; then
            node tools/sut-cost-report.mjs --read competitor-read.json | tee sut-cost.txt
          else
            echo "the reading stage wrote no json, so no row can be priced" | tee sut-cost.txt
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo '## Retrieval-only comparison'
            echo ''
            echo 'No reader, no judge: these are evidence-recall numbers, not answer accuracy.'
            echo ''
            echo '```'
            cat competitor-sample.txt 2>/dev/null || echo 'sample run produced no output'
            echo '```'
            echo ''
            echo '### Reading stage (accuracy, not recall)'
            echo ''
            echo 'Reader and judge are the same model for every row. This is the only column comparable with a'
            echo 'published LongMemEval accuracy, and only if the reader and judge also match.'
            echo ''
            echo '```'
            cat competitor-read.txt 2>/dev/null || echo 'reading stage did not run'
            echo '```'
            echo ''
            echo '### Dispatch prompt (per-capability clause)'
            echo ''
            echo 'Same hits and judge as the reading stage above; the prompt inserts a capability clause.'
            echo ''
            echo '```'
            cat competitor-read-dispatch.txt 2>/dev/null || echo 'dispatch arm did not run'
            echo '```'
            echo ''
            echo '### Multi-session rewrite (dispatch2)'
            echo ''
            echo 'One clause differs from the stage above: the multi-session clause demands dated fact rows and an'
            echo 'enumerated candidate list instead of asking the reader to look harder.'
            echo ''
            echo '```'
            cat competitor-read-dispatch2.txt 2>/dev/null || echo 'rewrite arm did not run'
            echo '```'
            echo ''
            echo '### Cost and accuracy'
            echo ''
            echo 'The system-under-test column is its own spend, measured by the metering proxy from the provider'
            echo '`usage`. Prices and their date are printed by the tool, because a money column without them is not'
            echo 'checkable.'
            echo ''
            echo '```'
            cat sut-cost.txt 2>/dev/null || echo 'no cost row: no system under test, or no reading'
            echo '```'
            echo ''
            echo '### Paired tests'
            echo ''
            echo 'Exact McNemar over the questions that changed. A total four points apart can be a coin; this says'
            echo 'which it is.'
            echo ''
            echo '```'
            cat competitor-paired.txt 2>/dev/null || echo 'paired tests did not run'
            echo '```'
            echo ''
            echo '<details><summary>Full file</summary>'
            echo ''
            echo '```'
            cat competitor-full.txt 2>/dev/null || echo 'full run produced no output'
            echo '```'
            echo ''
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-retrieval
          path: |
            competitor-sample.txt
            competitor-sample.json
            competitor-full.txt
            competitor-read.txt
            competitor-read.json
            competitor-read-dispatch.txt
            competitor-read-dispatch.json
            competitor-sut-*.txt
            sut-llm-stats.json
            sut-cost.txt
            sut-llm-calls.jsonl
            mastra-manifest.json
            memcog-manifest.json
            competitor-read-dispatch2.txt
            competitor-read-dispatch2.json
            competitor-paired.txt
          if-no-files-found: warn
