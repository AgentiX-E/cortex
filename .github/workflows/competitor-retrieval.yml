# Retrieval-only comparison against LongMemEval-S, with no model and no API key.
#
# ## Why this workflow exists separately from `benchmark.yml`
#
# The benchmark workflow answers questions: it needs a reader, a judge, and a key. This one only asks whether
# each provider's retrieval puts the annotated evidence in front of a reader — so it needs none of the three,
# runs in minutes rather than hours, and can be dispatched after every change to the adapter or the signal.
#
# The two are not interchangeable and the difference is stated in the artifact: no reader means the numbers are
# evidence recall, not answer accuracy, and they must never be quoted as the latter.
#
# ## Why the corpus is fetched here instead of committed
#
# LongMemEval-S is ~115 MB and lives behind HuggingFace. The sandbox this repository is developed in can reach
# `api.github.com` and nothing else, so the only place this tool can meet the real corpus is a runner. That is
# also why the local default is the synthetic generator: the tool has to be runnable by a developer with no
# network at all, and it has to say which corpus it ran on.
name: Competitor Retrieval

on:
  workflow_dispatch:
    inputs:
      questions:
        description: 'Questions to sample round-robin across capabilities (0 = all 500)'
        required: false
        default: '100'
        type: string
      read_questions:
        description: 'Questions to read and grade (0 = skip the reading stage)'
        required: false
        default: '100'
        type: string
      read_arms:
        description: 'Comma-separated provider names to read (empty = the four default arms)'
        required: false
        default: ''
        type: string
      limit:
        description: 'Top-k the reader would see'
        required: false
        default: '10'
        type: string

permissions:
  contents: read

concurrency:
  group: competitor-retrieval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrieval:
    runs-on: ubuntu-22.04
    # 500 questions x 2 arms x 2 prompts is ~2,000 model calls; 100 questions is ~800.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Download LongMemEval-S
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p "${{ github.workspace }}/data"
          curl -fL --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            -o "${{ github.workspace }}/data/longmemeval_s_cleaned.json" \
            "https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json"
          node -e '
            const rows = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (!Array.isArray(rows) || rows.length === 0) {
              console.error("the corpus is not a non-empty JSON array");
              process.exit(1);
            }
            const annotated = rows.filter((row) => Array.isArray(row.answer_session_ids) && row.answer_session_ids.length > 0);
            console.log(`instances: ${rows.length}, with annotated gold: ${annotated.length}`);
            if (annotated.length === 0) {
              console.error("no instance carries answer_session_ids; every question would be unmeasurable");
              process.exit(1);
            }
          ' "${{ github.workspace }}/data/longmemeval_s_cleaned.json"

      # Two tables, deliberately: 100 questions is the H1 subset and 500 is the whole file. Running both costs
      # one extra pass and removes the question of whether a reading came from the sample or the population.
      - name: Compare providers (sample)
        env:
          LONGMEMEVAL_PATH: ${{ github.workspace }}/data/longmemeval_s_cleaned.json
        run: |
          node tools/competitor-harness.mjs \
            --data "$LONGMEMEVAL_PATH" \
            --questions "${{ github.event.inputs.questions || '100' }}" \
            --limit "${{ github.event.inputs.limit || '10' }}" \
            | tee competitor-sample.txt
          node tools/competitor-harness.mjs \
            --data "$LONGMEMEVAL_PATH" \
            --questions "${{ github.event.inputs.questions || '100' }}" \
            --limit "${{ github.event.inputs.limit || '10' }}" \
            --json > competitor-sample.json

      # The budget sweep. The published systems report one number each at a different context cost --
      # Contextier 91.6% at 2,807 mean tokens, Zep 90.2% at 4,408 median, Mem0 93.4% at 6,787 mean -- so a single
      # budget here would produce a number that cannot be placed beside any of them. Three rows, one per published
      # budget, is the smallest sweep that answers "at what cost" rather than "how high".
      - name: Compare providers (full file, budget sweep)
        env:
          LONGMEMEVAL_PATH: ${{ github.workspace }}/data/longmemeval_s_cleaned.json
        run: |
          : > competitor-full.txt
          for tokens in 2800 4400 6800; do
            echo "=== --budget-tokens $tokens ===" | tee -a competitor-full.txt
            node tools/competitor-harness.mjs \
              --data "$LONGMEMEVAL_PATH" \
              --questions 500 \
              --limit "${{ github.event.inputs.limit || '10' }}" \
              --budget-tokens "$tokens" \
              | tee -a competitor-full.txt
          done

      # The reading stage. This is the only step that needs a model: it answers each question from the retrieved
      # context with a Chain-of-Note prompt and grades the answer with the official per-type templates. Without it
      # the table reports evidence recall, which is an upper bound on accuracy rather than accuracy -- and the
      # published systems report accuracy, so no comparison is possible until this runs.
      #
      # Four arms only, and 100 questions: the cost is questions x arms x 2 model calls, and the arms left out are
      # the ones whose accuracy the recall column already determines.
      - name: Read and grade (2.8k budget)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LONGMEMEVAL_PATH: ${{ github.workspace }}/data/longmemeval_s_cleaned.json
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          ARMS_FLAG: ${{ github.event.inputs.read_arms != '' && format('--read-arms {0}', github.event.inputs.read_arms) || '' }}
        run: |
          if [ "${{ github.event.inputs.read_questions || '100' }}" = "0" ]; then
            echo "reading stage skipped by input"
            exit 0
          fi
          ARMS="${ARMS_FLAG}"
          node tools/competitor-harness.mjs \
            --data "$LONGMEMEVAL_PATH" \
            --questions "${{ github.event.inputs.read_questions || '100' }}" \
            --limit 10 \
            --budget-tokens 2800 \
            --read $ARMS \
            --json > competitor-read.json
          node tools/competitor-harness.mjs \
            --data "$LONGMEMEVAL_PATH" \
            --questions "${{ github.event.inputs.read_questions || '100' }}" \
            --limit 10 \
            --budget-tokens 2800 \
            --read $ARMS \
            | tee competitor-read.txt

      # The dispatch arm. Same hits, same judge, same corpus -- one prompt differs by an inserted per-capability
      # clause. The first reading answered 11 of 20 temporal questions whose evidence had been retrieved 20 of 20
      # times, and three published lines of work (TReMu, MemFlow, Test of Time) say the omission is dates,
      # arithmetic and block order. This is the smallest run that can confirm or refute that.
      - name: Read and grade with the dispatch prompt
        if: ${{ github.event.inputs.read_questions != '0' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LONGMEMEVAL_PATH: ${{ github.workspace }}/data/longmemeval_s_cleaned.json
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          ARMS_FLAG: ${{ github.event.inputs.read_arms != '' && format('--read-arms {0}', github.event.inputs.read_arms) || '' }}
        run: |
          node tools/competitor-harness.mjs \
            --data "$LONGMEMEVAL_PATH" \
            --questions "${{ github.event.inputs.read_questions || '100' }}" \
            --limit 10 \
            --budget-tokens 2800 \
            --read \
            --reader dispatch \
            --json $ARMS_FLAG > competitor-read-dispatch.json
          node tools/competitor-harness.mjs \
            --data "$LONGMEMEVAL_PATH" \
            --questions "${{ github.event.inputs.read_questions || '100' }}" \
            --limit 10 \
            --budget-tokens 2800 \
            --read \
            --reader dispatch \
            $ARMS_FLAG \
            | tee competitor-read-dispatch.txt

      # The multi-session rewrite. `dispatch` says "collect every block and do not stop at the first"; `dispatch2`
      # says what rows to write. The 500-question reading measured the first at 53->58 and 57->55 against the
      # temporal clause's 58->89 and 60->89, so the question is whether naming an artefact is what the shock
      # family needed. The two arms are byte-identical on every other capability (asserted in the reader tests),
      # so this run moves exactly one clause.
      - name: Read and grade with the multi-session rewrite
        if: ${{ github.event.inputs.read_questions != '0' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LONGMEMEVAL_PATH: ${{ github.workspace }}/data/longmemeval_s_cleaned.json
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          ARMS_FLAG: ${{ github.event.inputs.read_arms != '' && format('--read-arms {0}', github.event.inputs.read_arms) || '' }}
        run: |
          node tools/competitor-harness.mjs \
            --data "$LONGMEMEVAL_PATH" \
            --questions "${{ github.event.inputs.read_questions || '100' }}" \
            --limit 10 \
            --budget-tokens 2800 \
            --read \
            --reader dispatch2 \
            --json $ARMS_FLAG > competitor-read-dispatch2.json
          node tools/competitor-harness.mjs \
            --data "$LONGMEMEVAL_PATH" \
            --questions "${{ github.event.inputs.read_questions || '100' }}" \
            --limit 10 \
            --budget-tokens 2800 \
            --read \
            --reader dispatch2 \
            $ARMS_FLAG \
            | tee competitor-read-dispatch2.txt

      # Paired tests over the three arms. Without this the run reports three totals and a reader has to decide
      # whether 69.0 against 69.2 is a difference; with it the answer is an exact McNemar p on the discordant
      # questions, and it is the same computation every time. Both files carry one record per measured question,
      # including the questions neither arm got right, because those are the denominator.
      - name: Paired tests across the three arms
        if: ${{ always() && github.event.inputs.read_questions != '0' }}
        run: |
          set -e
          for pair in "competitor-read.json competitor-read-dispatch.json con->dispatch" \
                      "competitor-read-dispatch.json competitor-read-dispatch2.json dispatch->dispatch2"; do
            set -- $pair
            if [ -f "$1" ] && [ -f "$2" ]; then
              echo "=== $3 ==="
              node tools/paired-test.mjs "$1" "$2" | tee -a competitor-paired.txt
              echo
            else
              echo "=== $3: skipped, a run file is missing ===" | tee -a competitor-paired.txt
            fi
          done

      - name: Summary
        if: always()
        run: |
          {
            echo '## Retrieval-only comparison'
            echo ''
            echo 'No reader, no judge: these are evidence-recall numbers, not answer accuracy.'
            echo ''
            echo '```'
            cat competitor-sample.txt 2>/dev/null || echo 'sample run produced no output'
            echo '```'
            echo ''
            echo '### Reading stage (accuracy, not recall)'
            echo ''
            echo 'Reader and judge are the same model for every row. This is the only column comparable with a'
            echo 'published LongMemEval accuracy, and only if the reader and judge also match.'
            echo ''
            echo '```'
            cat competitor-read.txt 2>/dev/null || echo 'reading stage did not run'
            echo '```'
            echo ''
            echo '### Dispatch prompt (per-capability clause)'
            echo ''
            echo 'Same hits and judge as the reading stage above; the prompt inserts a capability clause.'
            echo ''
            echo '```'
            cat competitor-read-dispatch.txt 2>/dev/null || echo 'dispatch arm did not run'
            echo '```'
            echo ''
            echo '### Multi-session rewrite (dispatch2)'
            echo ''
            echo 'One clause differs from the stage above: the multi-session clause demands dated fact rows and an'
            echo 'enumerated candidate list instead of asking the reader to look harder.'
            echo ''
            echo '```'
            cat competitor-read-dispatch2.txt 2>/dev/null || echo 'rewrite arm did not run'
            echo '```'
            echo ''
            echo '### Paired tests'
            echo ''
            echo 'Exact McNemar over the questions that changed. A total four points apart can be a coin; this says'
            echo 'which it is.'
            echo ''
            echo '```'
            cat competitor-paired.txt 2>/dev/null || echo 'paired tests did not run'
            echo '```'
            echo ''
            echo '<details><summary>Full file</summary>'
            echo ''
            echo '```'
            cat competitor-full.txt 2>/dev/null || echo 'full run produced no output'
            echo '```'
            echo ''
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-retrieval
          path: |
            competitor-sample.txt
            competitor-sample.json
            competitor-full.txt
            competitor-read.txt
            competitor-read.json
            competitor-read-dispatch.txt
            competitor-read-dispatch.json
            competitor-read-dispatch2.txt
            competitor-read-dispatch2.json
            competitor-paired.txt
          if-no-files-found: warn
