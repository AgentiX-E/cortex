# The cortex-memory A/B, in a workflow of its own rather than as a step of
# `benchmark.yml`.
#
# ## Why the split, and it is not a preference
#
# `workflow_dispatch` accepts at most **25 inputs per workflow**. `benchmark.yml` had
# 26 once §13.17 registered the relevance signal and the width it is built at, and
# the dispatch that carried them was rejected:
#
#     422 Invalid Argument - failed to parse workflow: you may only define up to 25
#     `inputs` for a `workflow_dispatch` event
#
# Every layer beneath the registration tested green -- the arm option, the artifact
# field, the `env:` forward, the dispatch script's value -- and no run could start.
# That is the §7.3 side-channel defect one level up: an artifact would have described
# a configuration no run ever applied, because there was no run.
#
# The ceiling is per workflow, so the repair is structural rather than a subtraction.
# The arm's inputs move here, where they have a budget of their own and neither the
# B7 axis nor the main benchmark's can crowd them out. It is also the shape the
# dependency graph already has: this arm is the only entry point that can construct
# both of its sides (`cortex-eval` cannot see `CortexMemory`), so it is the one job
# whose inputs are about the cognitive layer rather than about the reference pipeline.
#
# `tools/__tests__/test_dispatch_inputs.py` pins each dispatch script to the workflow
# that declares its inputs, so "the key exists in one of the workflows" is not a
# passing answer -- which is what makes this split safe rather than merely tidy.
#
# ## What the split does not change
#
# The job is the same job. The reader, the embedding cache and the pre-registered
# scale are all unchanged, and the cache stays shared with the main benchmark through
# `actions/cache` keyed on the dataset hash -- so the two workflows still grade
# against one set of vectors, which is the property that makes their numbers
# comparable at all.
name: Benchmark (cortex-memory A/B)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Sample size (0 = full 500-question dataset). The pre-registration fixes 0; the default is the main benchmark's to keep an unconfigured dispatch cheap"
        required: false
        default: '60'
        type: string
      ablation_runs:
        description: "Repetitions per ablation. 4 is the pre-registered scale and the default, because one repetition is a single sample: section 13.118.5 measured four repetitions of one configuration spread over 16 questions on the roster, which is what a one-repetition artifact cannot report"
        required: false
        default: '4'
        type: string
      temperature:
        description: "Sampling temperature. '0' pins deterministic sampling (the pre-registered value, and now actually sent); 'default' sends no temperature at all, which is what every run before section 13.119 did by accident"
        required: false
        default: '0'
        type: string
      model:
        description: 'DeepSeek model id (deepseek-chat, deepseek-v4-pro, ...)'
        required: false
        default: 'deepseek-chat'
        type: string
      thinking:
        description: 'Thinking mode: enabled or disabled (default disabled for shallow QA)'
        required: false
        default: 'disabled'
        type: string
      embedding_batch_interval_ms:
        description: 'Minimum spacing between consecutive embedding requests in ms (0 = unpaced). Zhipu throttles on request rate, so a real run should pace'
        required: false
        default: '0'
        type: string
      cortex_memory:
        description: "Run the cortex-memory A/B: 1 = run it, 0 = nothing. Defaults to 1 because this workflow exists for that one arm -- the toggle is kept rather than removed so a dispatch can still ask for an empty run, and it is forwarded rather than hardcoded so the arm's own reader (`readToggle`, which recognises only the literal 1) has a single source of truth"
        required: false
        default: '1'
        type: string
      cortex_memory_retrieval_threshold:
        description: 'Retrieval threshold for the cortex-memory arm, in [0, 1] (empty = 0, answer whenever anything was admitted). Separate from cortex_memory_threshold because it gates a different decision: whether the admitted evidence is strong enough to ANSWER with, not whether a turn was worth keeping. Run 37094200823 published threshold=0 with an ungated abstention path and scored 6.40%, so the two are now recorded and set independently'
        required: false
        default: ''
        type: string
      cortex_memory_session_budget:
        description: 'Turn budget across all presented sessions for the cortex-memory arm (empty = unbounded)'
        required: false
        default: ''
        type: string
      cortex_memory_source_trust:
        description: 'Source trust stamped on every memory the cortex-memory arm admits, in [0, 1] (empty = 0.5, the value admission.ts hardcoded before the field existed). It is the ceiling of the value function confidence * sourceTrust * (0.5 + 0.5 * recency), so at the 0.5 default the reachable interval is [0, 0.5] and cortex_memory_retrieval_threshold can only be always-open or always-closed -- which is why run 37110579101 reproduced run 37094200823 digit for digit. Raising it to 1 makes threshold > 0.5 reachable'
        required: false
        default: ''
        type: string
      cortex_memory_ask:
        description: 'Instruction block the cortex-memory arm asks every route with: empty or route = each route own block (shipped behaviour); extractive = the reference pipeline two-line block applied everywhere, which still names the abstention token but never calls declining "expected and valid"; aggregate = that block plus one sentence saying the answer may require combining evidence from more than one turn or session, reaching ONLY the multi-session and flat routes so the four routes that keep their own block stay byte-identical; computed = each reached route own block WITH that sentence inserted immediately above its closing line, reaching multi-session, flat and temporal; enumerated = section 13.34, computed PLUS a two-step contract on the multi-session route ALONE -- enumerate every matching item with its date, then compute per the kind of question asked, and make the abstain token conditional on the list existing. Run 38828538851 is why: the MR failures are 41 numeric mismatches of 47 wrong answers and 22 abstentions taken with 14-20 gold turns already in the window, so the reader has the evidence and either miscounts it or declines with it in hand, while the reference pipeline scores 86.78% on MR over a smaller window with a two-step contract of its own. On flat and temporal this ask is byte-identical to computed (asserted in evidence-ask-reach.test.ts), so the TR gain from the temporal route and the 88.67% that IE holds on the flat path are held and the only route whose reading moves is multi-session -- it composes rather than substitutes, which is the whole of section 13.20 finding, and on the two routes whose own block already IS the extractive one it is byte-identical to aggregate, asserted in evidence-ask-reach.test.ts, so the only route whose reading differs from the aggregate run is temporal (see PREREGISTRATION-CORTEX-MEMORY-ARM.md 13, 13.20, 13.21, 13.22). This is section 13 single variable and a SEPARATE axis from cortex_memory_prompt_contract: a contract selects a rendering, an ask selects an instruction block, and the experiment requires them to move independently. Two routes are deliberately unaffected and the artifact says so: multi-session and the flat path already ask with the extractive block, so this option is a byte-identical no-op on them -- which matters because section 13 headline prediction is about multi-session. An unrecognised value is REJECTED rather than defaulted, because a run dispatched to widen the ask that silently ran the shipped one would publish an unchanged result reading as evidence the ask does not matter; sweep = section 13.92, a two-step contract on the multi-session route ALONE that makes the list a walk instead of a recollection -- Step 1 writes one line for EVERY session the prompt printed, `Session <n>: <items, or none>`, and Step 2 counts the items those lines name. The measurement it is written against is the list census of run 39367801501: median Step 1 list 2.0 items across all 121 MR records over a window of 174 turns in about thirty sessions, and on the thirty questions whose gold is a small count (an integer from 2 to 10) six of the ten wrong ones list fewer items than the gold count and none lists exactly that many. The evidence is carried -- those questions sit at 100 percent of their user gold -- so the failure is that the reader does not walk it, and one record says so in its own words before merging two mentions into one item and answering 1 against a gold of 3. Unlike enumerated this ask is NOT computed on the other five routes: they keep the shipped block byte for byte, which makes IE, KU, ABS and TR an internal control -- their windows and promptChars must reproduce to the character; aggregation = section 13.103, the reference pipeline aggregation shape installed on the multi-session route ALONE, and it differs from enumerated in three decisions rather than in tone: Step 1 asks for `<item> | <the action the question names> | <date>` and says an EXCHANGE IS TWO ITEMS (record 0a995998 merges one drop-off and one collection into one event and answers 1 against a gold of 3, and bf659f65 does the same with albums bought and downloaded); Step 2 is a four-line mapping from question form to operation rather than the instruction to compute as asked (how many distinct to a count, how many hours-days-weeks in total to a SUM of durations, how much money to a SUM of amounts, what time or which event to that value and not a count); and declining is narrowed to the evidence saying nothing about the question at all, because needing to add, subtract, convert or compare what it does state is NOT a reason to decline and 7 of this arm 10 MR declines are questions whose evidence states the operands. The closing line drops the word number, so a time or an event is a legal Step 2 answer. The reference pipeline reaches 102 of 121 with this shape on the same model, the same dataset and a SMALLER window, which is what makes it a candidate rather than a rewrite. The reach is the same three routes as enumerated and the two asks differ on ONE: the flat path and the temporal route read exactly what enumerated gives them, so a run of aggregation against an enumerated control is a single-variable test on multi-session. Section 13.104 records why the first dispatch of this ask got that wrong -- its fallthrough returned the control block and silently removed the merging sentence from flat and temporal, which cost TR 21 questions and IE 9 in a run registered as single-variable; silent = section 13.123, enumerated WITH THE STEP 1 NOTES MADE PRIVATE on the multi-session route alone -- same two steps, same per-form arithmetic, same merging sentence, same reach, so flat and temporal are byte-identical to enumerated and the single variable is what MR reads. It is written against a diagnosis rather than a wording: section 13.34 read the reference ML lead as enumerate matching items first, and every ask since sharpened how the list is WRITTEN while section 13.96 records that direction as three attempts, each lengthening the list, none raising accuracy. The reference builder says the opposite -- write ONLY the final answer, and do NOT write the notes out -- and section 13.92 prices the difference from the response side as a median Step 1 list of 2.0 items against a gold count of 3 to 10. The decline clause moves with Step 1 because the two are one decision: a written list is inspectable and an unwritten one is not, so a dispatch that moved only the first would demand a list while licensing a decline that reads an unwritten one; silent (refuted: run 40792853362, ask=silent, four repetitions, one config field from the enumerated control) = MR 87 -> 61, a loss of 26 questions; of the 66 MR questions whose carried turns are byte-identical the control answers 48 and this arm 31, so the loss is the instruction rather than the evidence, and the wrong answers are under-sums of one missing item (`25 + 40 + 120 = 185` becomes `65`). Section 13.127 keeps this value as the ablation reference for `the written list is the state Step 2 counts from`, not as a candidate. The same run measured the floor the readout uses: on IE, KU, TR and ABS the prompt is byte-identical and 19 of 379 verdicts still changed (5.0%), so temperature 0 pins the sampling parameter and not the output; answer-line = section 13.124, the flat route alone, and it states a reply SHAPE where extractive states a reply LENGTH. Written against nine of IE ten wrong answers being one of four shapes -- the evidence block copied back at 31,547 and 16,766 characters, a sentence saying no items matched written instead of the token, free prose, and an empty reply -- with the tenth being the only genuine knowledge miss. The reference flat block carries both guards this route lacks: one line in exactly the form Answer colon phrase, and with no explanation. The parser already accepts that prefix, so the guard asks for a form the reader can be understood in rather than a new one. Its scope test is load-bearing: buildSessionPrompt builds with the same extractive contract, so a branch keyed on the contract alone would change MR under an ask registered as flat-only. (refuted: run 40807829150, ask=answer-line, four repetitions, registered against the enumerated control 40751394094) = overall 84.2 to 71.55 percent in one field, and the artifact said why in one line: askRoutes was flat against the control three routes. Two findings, and only one of them is about the guard. First, the fallthrough: the two routes the ask did not name lost the control block instead of keeping it, MR 87 to 39 and TR 100 to 88, which is section 13.104 defect arriving a fourth time in the ask whose docblock claimed to have keyed on the scope to avoid it, and the test asserted the shipped block so the gate passed. The reach is now enumerated with flat the only route whose bytes change. Second, the guard itself, measured on its own route against the 150 IE questions split by the shape of the GOLD, which nothing had done: 117 short-gold questions moved 116 to 116 and 33 paragraph-gold questions moved 24 to 12, so the guard is inert on its target and destructive on the other subset. Reading the thirteen flips says why, and it is not a shape problem: seven force a one-line phrase onto a question whose gold is a paragraph, and six end at the literal string Answer colon INSUFFICIENT_EVIDENCE -- a decline the parser accepts and isBareDecline rejected, so the arm own retry pass (92 of 92 conversions in the control) reported attempted 0 and never fired. Declines per run doubled, 50 to 108, which is section 13.104.5 longer instruction buys declines with a number on it; recommend = section 13.129, the flat route licence to COMPOSE and its ban on quoting the evidence, written against the 33 paragraph-gold questions and their nine failures: three are the evidence block copied back at 31,547 and 16,766 characters, four are the reader declining in prose (No evidence items match the question about a Miami hotel) because the block tells it to extract a fact and a recommendation has to be composed, and two are prose answers the judge did not accept. The reference pipeline states the same diagnosis in RECOMMENDATION_CONTRACT, whose docblock records that the extractive contract pushed abstention on the preference subset from 3.45 to 21.84 percent because it reads as having nothing to say. It adds NO reply shape, NO prefix and NO word count as a shape: answer-line proved a shape is a tax on every question whose gold is not that shape. It states what the answer may DO -- build the recommendation from what the user already said they like, and do not quote, copy or list the evidence turns, in at most three sentences. Predictions: the paragraph subset 24 to at least 28 of 33; the short-gold subset at least 113 of 117 against a reader floor of 5.0 percent on 379 identical-prompt verdicts; declines per run at most 60 against the control 50; MR, TR and ABS prompts byte-identical, which is what the reach above and ask-changes.test.ts now enforce.'
        required: false
        default: ''
        type: string
      cortex_memory_relevance:
        description: 'Relevance signal the cortex-memory arm spends its prompt budget with (see PREREGISTRATION-CORTEX-MEMORY-ARM.md 13.17): empty or none = the budget buys the first turns that arrived, which is the shipped behaviour and what every prior artifact was produced with; retrieval = the budget buys the turns the arm own bi-encoder ranks highest for the question; retrieval-session = PREREG-MR-SESSION-CHANNEL, each SESSION scored as one unit (its joined turns, one embedding) and that score projected onto every turn it contains, so relevance_units=session ranks by session rather than by a turn that happens to sit in it. The two are meant to travel together: with units=turn a session-constant score degenerates to arrival order, and with units=session a turn-scored signal ranks a session by whichever of its turns won a comparison the session score already settled. Its top-k counts SESSIONS, not turns, so 32 is a wide pool here where 32 turns would be narrow. Section 13.16 is why this is the variable and nothing else is: run 38142407062 measured that the prompt carried 4.69% of a 506338-character mean context and that the gold turn was inside what the model read for 11.6% of questions, against a ceiling of 92.1% -- the share of questions whose answer turn is in the bundle at all (MEASURE-B2-RECALL-CURVE.md). The budget has been shown to be neither too small nor too large; whether it buys the turns that matter has not been measured. The signal is built from the question text and its context ONLY, never from the answer key, and the index type makes that structural rather than promised. An unrecognised value is REJECTED rather than defaulted to none, because a run dispatched to rank its turns that silently ran arrival order would publish a delta reading as evidence that ranking does not help -- the one conclusion this dispatch exists to test'
        required: false
        default: ''
        type: string
      cortex_memory_relevance_top_k:
        description: 'Turns per question the relevance index scores (see PREREGISTRATION-CORTEX-MEMORY-ARM.md 13.17): empty = 64, the index default, chosen at or above the knee of a measured recall curve (recall 0.921 at k = 50, curve already flattened -- MEASURE-B2-RECALL-CURVE.md); a positive integer = that width. Recorded beside the signal because the two are different claims: the name says a ranking was applied, the width says how much of the context it could speak about. A width at or above roughly 167 leaves the width inert relative to the budget (the prompt holds about that many turns at 24000 characters, so every scored turn survives selection); below that the scored set is genuinely the whole selection. A value below 1 is REJECTED rather than clamped, because a width of 0 scores nothing, which leaves every turn at the unscored floor -- the selection degenerates to arrival order while the artifact config line still claimed a ranking'
        required: false
        default: ''
        type: string
      cortex_memory_relevance_units:
        description: 'Unit the relevance budget is spent in, when a signal ranked the turns (see PREREGISTRATION-CORTEX-MEMORY-ARM.md 13.27 and 13.31): empty or turn = the budget buys individual turns wherever they score highest, which is the shipped behaviour and what every prior artifact was produced with; session = the budget buys whole SESSIONS ordered by their best-scoring turn, taking the largest PREFIX of that ranking and stopping at the first session that does not fit -- FROZEN, because run 38753835652 measured it and it lost, and an artifact is only reproducible if the rule that produced it still exists; session-fill = the same ranking with the search repaired, skipping a session that does not fit and continuing down the list until the room is spent. Section 13.26 is why the unit was tried: run 38595325261 measured MR accuracy at 14.3%, 33.3%, 41.5% and 66.7% across the first four bands of gold-overlap coverage, with a median carried count of 14 against a median gold session of 24 -- accuracy tracks how much of the answer session the reader was shown, and a turn-unit budget does not deliver it. Section 13.31 is why the repair is a third value rather than an edit: the prefix rule never spent the room (that run median 12 carried turns against a room holding about 23), so a session larger than the room ended the pass and the sessions behind it went unread. Reaches the multi-session route ALONE: buildPrompt receives no session boundary, so the unit cannot be expressed on flat, temporal, knowledge-update, abstention or assistant, which is what makes this dispatch single-variable. Inert without a signal, because an arrival-order prefix has no ordering for a unit to act on. An unrecognised value is REJECTED rather than defaulted to turn, because a run dispatched to complete whole sessions that silently spent the room on turns would publish an unchanged result reading as evidence the unit does not matter'
        required: false
        default: ''
        type: string
      cortex_memory_max_turn_chars:
        description: 'Per-turn character cap the cortex-memory prompt is assembled under (see PREREGISTRATION-CORTEX-MEMORY-ARM.md 13.67 and 13.68): empty = no cap, which is what every prior artifact was produced with and is expressed by NOT passing the key, so an archived prompt stays reproducible byte for byte; a positive integer = each turn contributes at most that many characters to the evidence section. Section 13.67 is why this is the variable: section 13.34.3 argued the evidence room is not the constraint, from COUNTS (a median of 26 turns in the window against a median gold set of 24, so a perfect selector would reach 0.917 coverage), and the --turns readout on the adopted run artifact measured the other half of that room arithmetic -- the delivered turns have a MEDIAN of 272 characters, p90 2305, max 15369, so 26 of them are 7072 characters in a 24000-character room. The room is spent on a tail rather than on turns, which is why the cut that decides coverage falls at rank 26 while the pool holds 64 (section 13.66: the pool carries 73.2% of the gold and the delivery 54.2%). Capping what one turn may contribute moves that cut, which is the one thing the gold rank curve said would help. It is presentation only: the roster, lastRetrievedContext and every coverage count still describe the turns as they arrived, because a record describing the capped text would report a prompt the model never read with a number that looks like a coverage measurement. A value below 1 or a fraction is REJECTED rather than clamped, because a cap of 0 emits every turn number with no text after it while every coverage count still reports the turns as they arrived -- a prompt that reads as empty evidence and an artifact that reads as a delivery'
        required: false
        default: ''
        type: string
      cortex_memory_max_prompt_chars:
        description: 'Evidence budget in UTF-16 code units: how many characters one prompt may hold (see PREREGISTRATION-CORTEX-MEMORY-ARM.md 13.81). Empty = the product default of 24000, which is what every archived run used; a positive integer = that budget. This input did not exist until section 13.81 because every experiment traded truncation against room INSIDE 24000, and section 13.80 found that trade floor: at a 200-character cap the room reached 100 turns and MR fell to 29 of 121, with 42 abstentions at a median coverage of 86.1 percent -- a 223-character mean turn is a fragment and the model declines from fragments. Raising the budget buys the same room with no additional truncation, which no smaller cap can do. A budget of 0 is REJECTED rather than clamped, because the allocator would fail at its first step and every question would answer from no evidence while the artifact recorded a budget'
        required: false
        default: ''
        type: string
      cortex_memory_max_turn_chars_routes:
        description: 'Which routes the per-turn cap reaches (see PREREGISTRATION-CORTEX-MEMORY-ARM.md 13.73): empty or all = every route, which is what section 13.68 shipped and what run 39180819474 measured; none = a cap that reaches nothing; a comma-separated list of multi-session, temporal, flat, knowledge-update, abstention, assistant = exactly those. Section 13.72 is why this is a separate variable rather than a different width: one cap over every route produced +13 on MR and -30 on IE in the same run, and the loss is not a matter of degree -- IE thirty lost questions went correct to abstention at a MEDIAN COVERAGE OF 100%, so the model was given complete evidence and withdrew forty-two times instead of fifteen, because the flat route never received the conditional closing line and seventy-three turns of noise give its unconditional decline more chances to be true. No smaller cap turns a complete window into a partial one on a question that needs one turn, so a width sweep would find a compromise between two capabilities rather than a setting that is right for both. The reach is the campaign own pattern for route-varying behaviour (renderingRoutes, askRoutes): an explicit list, recorded in the artifact, with the untouched routes byte-identical to their-control. An unrecognised route name is REJECTED rather than ignored, because a run that applied the cap to five of six routes would report every number consistent with having applied it to six'
        required: false
        default: ''
        type: string
      cortex_memory_review_pass:
        description: 'The review pass this run administers. SHIPPED DEFAULT IS `bare`: the bare-decline retry measured +3.15 points over four runs against two controls (417/415/416/421 vs 404/399, no category lower, ABS 29/30 in all six). `none` is the control and must be named explicitly by any run that wants it. (see PREREGISTRATION-CORTEX-MEMORY-ARM.md 13.94): empty or none = one consultation, which is the state every archived run is in; audit = after the first answer, re-ask with the same evidence, the first response quoted verbatim, and the review restricted to MEMBERSHIP -- name items in the evidence that the first pass missed, split an entry that merges two events, merge two entries that describe one event, drop an entry the evidence does not support -- then reply with the corrected count under a Step 2 heading. It is not a re-ask of an abstention and not a retry: a first pass that declined is returned unchanged, because there is no list to audit. The measurement it is written against is sections 13.92 to 13.93: every MR response walked all 44 sessions of its window (median 44 session lines, 121 of 121 scanning, none skipped) and the median count of item-bearing lines stayed at 2.0, while record 0a995998 lists two mentions of one boots exchange, merges them into one item and answers 1 against a gold of 3, with a blazer at the dry cleaner sitting in a session it marked none. The deficit is which items enter the list, not how much of the document the reader looked at. The reach is implicit -- the pass lives in answerSessions -- so the other five routes are byte-identical by construction and cannot be configured into it. An unrecognised value is REJECTED rather than defaulted, because a run dispatched to administer a treatment that silently ran the control would publish an unchanged result reading as evidence the treatment does not matter; recover = the abstention pass (cortex/docs/MEASURE-ABSTENTION-RECOVERY.md) -- after a DECLINE whose Step 1 list is NON-EMPTY, ask once more with the list quoted and no evidence re-sent, then use the answer if one comes back. Measured on three archived runs: every MR abstention carries a non-empty list (8/10, 7/9, 8/9 -- the two others list only absence, which the predicate excludes), TR carries 4 to 7 of 15 to 23, ABS carries none of 30, and abstentionReasons reports threshold 0 -- so these are the reader declining with the evidence in hand, and on MR and TR an abstention is always wrong, which makes the population 13 to 17 questions per run that no retrieval change can touch. It is a value of this input rather than an input of its own because the field was always named rather than boolean for exactly this: audit re-asks every answered question (500 calls) and recover re-asks only a decline that carried a list (~15), so they are two treatments rather than two knobs, and no run should run both. The workflow is at 24 of 25 dispatch inputs, and the suite forbids sitting at the ceiling, so a new knob has to be a new value.; recover = the abstention pass (cortex/docs/MEASURE-ABSTENTION-RECOVERY.md) -- after a DECLINE whose Step 1 list is NON-EMPTY, ask once more with the list quoted and no evidence re-sent, then use the answer if one comes back. Measured on three archived runs: every MR abstention carries a non-empty list (8/10, 7/9, 8/9 -- the two others list only absence, which the predicate excludes), TR carries 4 to 7 of 15 to 23, ABS carries none of 30, and abstentionReasons reports threshold 0 -- so these are the reader declining with the evidence in hand, and on MR and TR an abstention is always wrong, which makes the population 13 to 17 questions per run that no retrieval change can touch. It is a value of this input rather than an input of its own because the field was always named rather than boolean for exactly this: audit re-asks every answered question (500 calls) and recover re-asks only a decline that carried a list (~15), so they are two treatments rather than two knobs, and no run should run both. This workflow sits at 24 of the 25 dispatch inputs, and the suite forbids the ceiling, so the next knob has to be a new value. bare = the SHAPE pass (cortex/docs/MEASURE-SOTA-FAILURES.md section 2): after a reply that was the abstention token and nothing else -- no list, no prose -- ask once more with the same evidence and the same question, and with the token ABSENT from the prompt, so declining is not among the answers offered. Reach is flat and temporal only, which is where the 21 first-attempt bare declines sit; multi-session is excluded because it already runs recover and two retries on one route is two variables, and the abstention route is excluded outright because there its bare token is the CORRECT answer. The measurement it is written against: of 45 wrong declines on the shipped arm 30 are that bare token, while ABS reads 30/30 with 29 of its 30 answers being the same token -- the shape is optimal exactly where it is graded and unpunished on the four capabilities that do not grade it, and the ask already calls it invalid (21 violations, so the sentence is advice rather than a constraint). It is a value of this input rather than an input of its own because the workflow is at 24 of 25 dispatch inputs and these are two treatments rather than two knobs.'
        required: false
        default: 'bare'
        type: string
      cortex_memory_query_expansion:
        description: 'Whether the multi-session ranking is built from the question alone or from the question plus model-written activity phrases (see PREREGISTRATION-CORTEX-MEMORY-ARM.md 13.97): empty or none = the bare question, which is the state every archived run is in; llm = one model call per multi-session question BEFORE the relevance index is built, and that question is retrieved against [question, ...phrases]. The phrases cannot be written during answering: the relevance callback is a synchronous table lookup, so a phrase produced at answer time would read the index floor score and the treatment would be unmeasurable. Only MR questions are expanded -- the other four capabilities keep their exact queries, ranking and window, which is this dispatch internal control. The measurement it is written against is section 13.96: three prompt-side attempts (structure, membership review, first-pass ledger) each lengthened the list and failed to raise accuracy, which moved the diagnosis from the reader to WHICH MENTIONS COUNT as instances -- a matching decision made before any list exists. --numbers localises it: on run 39416366870 the gold digit string appears nowhere in the window for 12 of the 44 wrong MR answers that state a number, and a digit that appears nowhere was never read, so no wording reaches it. A refusal is recognised rather than truncated: the reference pipeline once carried the three sentences of a model refusal into retrieval as phrases, so this parser drops refusal text and the artifact records how many questions were refused whole. An unrecognised value is REJECTED rather than defaulted, because a run dispatched to widen retrieval that silently ran the bare question would publish the control reading under the treatment name'
        required: false
        default: ''
        type: string
      cortex_memory_self_consistency:
        description: 'How many times the multi-session route consults the model on one prompt, and whether the answers are reduced by strict majority (see PREREGISTRATION-CORTEX-MEMORY-ARM.md 13.101): empty or none = one consultation, which is the state every archived run is in; 3 = three consultations of a BYTE-IDENTICAL prompt, and the answer a strict majority holds wins. Null is a candidate, so a majority of declines is a decline; with three different answers the first pass is returned and the question counts as a split. The mechanism is written against section 13.100.2, which ran one configuration twice: 24 of 121 multi-session answers changed, 59 of 500 states changed dataset-wide, and every prompt window reproduced to the character. The reader judgement is the unstable part, so this samples it instead of trying to talk it out of being unstable -- which three prompt-side attempts already failed to do. It touches the multi-session route alone by construction, so the four other capabilities keep their windows to the character and answer nothing differently. An unrecognised value is REJECTED rather than clamped, because a run dispatched at a count the product would clamp would publish a configuration it never administered'
        required: false
        default: ''
        type: string
      cortex_memory_evidence_roles:
        description: 'Turn roles the evidence may be built from (see PREREGISTRATION-CORTEX-MEMORY-ARM.md 13.83): empty or all = every turn, which is the state every run before section 13.83 was in; user or assistant or a comma-separated list of the two = only those roles reach the prompt on the routes named by the next input. Section 13.82 is the measurement: on the 48,000-character run the multi-session route rendered 48.1 percent user characters and 51.9 percent assistant, while the reference pipeline reaches 85.95 percent on that capability at half the budget by restricting retrieval to user turns -- its own source states the reason, that the facts live in the user statements and assistant turns are verbose generated chatter that dilutes the answer signal. The filter is applied after admission and before selection, so the room is spent only on turns that may reach it, and lastRetrievedContext and every coverage count describe the filtered list because that is what the reader could have been shown. none is REJECTED rather than read as an empty set, because an empty role set admits no evidence at all and would spend a decline per question while the artifact recorded a filter'
        required: false
        default: ''
        type: string
      cortex_memory_evidence_roles_routes:
        description: 'Which routes the role filter reaches (see PREREGISTRATION-CORTEX-MEMORY-ARM.md 13.83): empty or all = every route; none = a filter that reaches nothing; a comma-separated list of multi-session, temporal, flat, knowledge-update, abstention, assistant = exactly those. Scoped from the start for the two reasons section 13.73 scoped the cap: a global filter moves three capabilities that are not part of this experiment, where 75.8 to 77.3 percent of their rendered characters are assistant turns, and the untouched routes are the experiment own control -- they must reproduce their control window to the turn. An unrecognised route name is REJECTED rather than ignored, because a run that applied the filter to five of six routes would report every number consistent with having applied it to six'
        required: false
        default: ''
        type: string
      cortex_memory_prompt_contract:
        description: 'Evidence rendering the cortex-memory arm uses: empty or abstention = the baseline rendering (numbered turns, blank-line separated); abstention-evidence-blocks = every turn labelled with its source memory id, so a boundary the admission layer preserved is visible to the model rather than implied by position (see PREREGISTRATION-CORTEX-MEMORY-ARM.md 12.5, 12.9). This is the single variable of the 12.5 experiment: 12.4 measured b-to-f repairs of zero on every capability with the feature abstentions attributed to the model, and 12.3 measured that no retrieval threshold can carry the arm, so what remains is what the arm PRESENTS. It is a RENDERING and not a contract override: every route keeps its own instruction block and only the evidence presentation moves, which is why it now reaches all six dispatched routes rather than the abstention route alone. The gate inputs are deliberately unchanged by this switch. An unrecognised value is REJECTED rather than defaulted to the baseline, because a run dispatched to test a rendering that silently ran the baseline would publish a delta reading as evidence the rendering does not help'
        required: false
        default: ''
        type: string
      cortex_memory_rerank:
        description: 'Cross-encoder reranking over the retrieved pool, the one stage RAW-RAG has and this arm does not (see PREREGISTRATION-CORTEX-MEMORY-ARM.md 13.115 and SOTA-LANDSCAPE.md 4.9). Empty or none = the retrieved order is the order the budget spends, which is every prior artifact; on or openai = score each (question, turn) pair through an OpenAI-compatible /rerank endpoint -- the Runner points it at Zhipu rerank -- and reorder the whole retrieved pool before the budget sees it. The mechanism is not an optional refinement: removing the identical stage from RAW-RAG costs 3.92 points, more than any mechanism they added, and it is the largest single component of their pipeline. THREE PROPERTIES ARE PRE-REGISTERED AND THE ARTIFACT MUST SHOW ALL THREE. First, the pool must fit the endpoint in ONE call: Zhipu accepts 128 documents of at most 4096 characters each and rejects the whole call above either bound, so this arm runs relevance_top_k=128 here and the 128-document limit is declared in the job env as CORTEX_MEMORY_RERANK_MAX_DOCUMENTS -- the index REFUSES a wider pool at construction rather than batching it, because relevance_score is normalised per call and a batch-local winner can outrank a true winner while every number still looks plausible. Second, fallbacks must be zero: cortex-core rerankHits degrades to the retrieved order on a thrown request, a short reply or a non-finite score, so an arm whose endpoint answered 401 five hundred times produces the same accuracy as one whose cross-encoder agreed with the retriever every time. fallbacks > 0 is registered as an ASSEMBLY FAILURE, not as evidence that reranking does not help, and the report prints that sentence beside the counters. Third, changed is reported beside fallbacks because they are the two halves of did the stage do anything: 0 and 0 is a cross-encoder that ran and confirmed the ranking, which is a result, while 500 and 0 is a stage that never executed. Passages longer than the per-document limit are clipped at the boundary and counted separately, so the reader can see how often the ordering judged a prefix -- the reader itself still sees the whole turn. The control is the same arm at the same pool width without the stage, so the only variable is the reranking; section 13.4 requires this dispatch to follow the budget decision rather than run beside it, because both change what the reader sees'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  # Section 13.115's endpoint. Machine configuration rather than an experimental variable, so it lives
  # here and not in the dispatch's input list -- which is now at GitHub's 25-input ceiling, a constraint
  # this file's header records. Zhipu's /rerank is the OpenAI-compatible shape cortex-ai already speaks,
  # and its key is already in the Runner, so the stage costs no new secret.
  # Section 13.30's per-pass wall-clock ceiling, now a workflow constant rather than a dispatch input.
  # It is a HANG DETECTOR, not an experimental variable: 90 minutes is about three and a half times the
  # longest pass any completed run has produced on this arm (a full run is roughly 3h32m for eight
  # passes). It moved out of the input list when the reranking switch needed the slot -- the surface
  # sits one below GitHub's 25-input ceiling, and `test_dispatch_inputs.py` refuses a workflow that
  # reaches it. The precedent is `evidenceTurnsPerRecord` (section 13.94): a value that is a
  # writability guard rather than a treatment belongs in the job, where a reader of a run looks anyway.
  CORTEX_MEMORY_BUDGET_MINUTES: '90'
  CORTEX_MEMORY_RERANK_BASE_URL: https://open.bigmodel.cn/api/paas/v4
  CORTEX_MEMORY_RERANK_MODEL: rerank
  # The endpoint's published wire limits: 128 documents per call, 4096 characters per document. The
  # first is what forces relevance_top_k=128 on this arm (the index refuses a wider pool rather than
  # batching it); the second is why long turns are clipped at the boundary and counted.
  CORTEX_MEMORY_RERANK_MAX_DOCUMENTS: '128'
  CORTEX_MEMORY_RERANK_MAX_DOCUMENT_CHARS: '4096'
  RERANK_API_KEY: ${{ secrets.ZHIPU_API_KEY }}

jobs:
  cortex-memory-ablation:
    name: cortex-memory A/B
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: python3 -m pip install --requirement tools/requirements-dev.txt

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Built and not `pnpm check`ed. The gate is `Verify`'s job and runs on every
      # push, so repeating it here would spend the arm's wall-clock budget on a
      # result already published beside it. What this workflow needs is the compiled
      # `dist` the bench entry points import.
      - name: Build packages
        run: pnpm build

      - name: Download LongMemEval-S
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p "${{ github.workspace }}/data"
          curl -fL --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            -o "${{ github.workspace }}/data/longmemeval_s_cleaned.json" \
            "https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json"

      # Keyed on the dataset hash, which is the same key `benchmark.yml` uses -- so
      # whichever workflow runs first pays for the vectors and the other finds them
      # cached. This is the property that keeps the two reports comparable, and it is
      # why the restore has to happen before either side of the A/B touches a turn.
      # The primary key names the entry THIS run will write, and deliberately cannot
      # match anything older.
      #
      # It used to be the bare dataset hash, while the save below had learned to append
      # `${{ github.run_id }}`. The comment underneath claimed the prefix `restore-keys`
      # would then "pick up whichever entry was written most recently" -- and a measured
      # audit of the cache store says the opposite happened, for seven weeks:
      #
      #   cache 7119462708   691 MB   created 2026-08-29   last accessed 2026-10-16
      #   cache 9009810001  1099 MB   created 2026-10-15   last accessed 2026-10-15
      #   cache 9030207266  1100 MB   created 2026-10-16   last accessed 2026-10-16
      #
      # `last_accessed_at == created_at` on every run-keyed entry is the proof that the
      # prefix path had never run: an entry existed under the bare key, so the primary
      # key HIT, and `actions/cache` consults `restore-keys` only after a miss. Three
      # consecutive runs therefore each restored the same 170,095 vectors and each saved
      # a strictly larger cache that nothing read. Half of every job's wall clock
      # (1h38m-1h49m of ~3h21m) went into re-embedding turns the previous run had already
      # paid for, and `38910134192` finally died of it -- 11,476 live embedding requests,
      # then `429` / code 1113 / 余额不足, with no question started.
      #
      # `run_attempt` is in both keys so a re-run starts from its predecessor's entry: the
      # primary key misses, the prefix resolves to the most recently created entry, and
      # the vectors the failed attempt paid for are the ones it resumes from.
      - name: Restore embedding cache
        id: restore-embedding
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/data/embedding-cache.bin
          key: longmemeval-embedding-${{ hashFiles('data/longmemeval_s_cleaned.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            longmemeval-embedding-${{ hashFiles('data/longmemeval_s_cleaned.json') }}-
            longmemeval-embedding-

      # A separate step rather than a branch inside the main benchmark's, because the
      # two systems cannot be constructed by the same entry point: `cortex-eval`
      # cannot see `CortexMemory`, and the arrow in the dependency graph runs the
      # other way. `cortex-memory`'s own bench entry builds BOTH sides and calls
      # `runCortexMemoryArm`, which is what keeps the pair inside a single
      # `runAblationReport` call.
      - name: Run cortex-memory A/B
        if: github.event.inputs.cortex_memory == '1'
        env:
          LONGMEMEVAL_PATH: ${{ github.workspace }}/data/longmemeval_s_cleaned.json
          EMBEDDING_CACHE_PATH: ${{ github.workspace }}/data/embedding-cache.bin
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          # Read from the input rather than hardcoded to '1'.
          #
          # The `if:` above and this variable are two statements of the same fact, and
          # a duplicate statement is one that can disagree. Hardcoded, this line says
          # "the arm is on" unconditionally; the arm's own reader is strict
          # (`readToggle`: only the literal `'1'` is on, and a present-but-unrecognised
          # value is OFF), so a future dispatch that flips the toggle's spelling would
          # have the step run while the arm silently skipped, printing
          # `cortex-memory arm skipped` into a green run -- or the reverse, which is
          # the §13 failure where two arms came out byte-identical and the verdict was
          # about the dispatch rather than the feature.
          CORTEX_MEMORY: ${{ github.event.inputs.cortex_memory }}
          # Fixed at `0` rather than dispatched, and this is a reach claim rather than a convenience:
          # the admission gate has been 0 in every run this arm has ever dispatched, its one non-zero
          # excursion (section 10.9's 0.25) abstained on 479 of 500 and lost 186 questions, and
          # section 12.3 measured the hit and miss score distributions to overlap almost completely --
          # so no cut in the reachable range can carry the arm. Admission-wide-open is the premise of
          # every experiment here, not a variable within it. Section 13.101 needed the last input slot
          # for a variable that IS reachable; restoring this one costs a registration, which the
          # ceiling guard in test_dispatch_inputs.py will demand be traded rather than added.
          # `retrievalThreshold` stays dispatchable: that one gates a decision runs exercise.
          CORTEX_MEMORY_THRESHOLD: '0'
          CORTEX_MEMORY_RETRIEVAL_THRESHOLD: ${{ github.event.inputs.cortex_memory_retrieval_threshold }}
          CORTEX_MEMORY_SESSION_BUDGET: ${{ github.event.inputs.cortex_memory_session_budget }}
          # The ceiling, forwarded for the same reason as the two thresholds. Note that
          # this variable is what makes `cortex_memory_retrieval_threshold` mean
          # anything above 0.5: without it the arm can only express "always answer"
          # and "never answer", so a dispatch that set a midpoint retrieval threshold
          # while silently leaving the ceiling at its default would run a configuration
          # it believes is gated and is not. That is the §7.3 side-channel defect --
          # the run completes and the artifact describes the intent rather than the
          # code.
          CORTEX_MEMORY_SOURCE_TRUST: ${{ github.event.inputs.cortex_memory_source_trust }}
          # The per-turn confidence signal, and the reason the two variables above are
          # not sufficient on their own. `sourceTrust` raises the CEILING of the value
          # function; it does not vary the value, because a fixed source trust still
          # multiplies a `confidence` of 1 for every admitted turn. The result is a
          # reachable interval that is populated in appearance only -- every threshold
          # inside it is the same experiment. This variable is what supplies the
          # variation, and PREREGISTRATION-CORTEX-MEMORY-ARM.md 11 records that the
          # pair together is what makes a cut mean anything.
          # Fixed at `none` rather than dispatched, and this is a reach claim rather than a
          # convenience: the registered configuration sets BOTH gates to 0, the value function is
          # bounded below by 0, so `value >= 0` holds for every turn and the confidence signal
          # cannot change a single admission decision. It is an unreachable variable under the
          # configuration any dispatch of this arm runs. §13.97 needed the last input slot for a
          # variable that IS reachable, so the unreachable one became a constant; restoring it as
          # an input costs a registration, which the ceiling guard in test_dispatch_inputs.py will
          # demand be traded rather than added.
          CORTEX_MEMORY_CONFIDENCE: 'none'
          # §12.5's single variable, forwarded for the same reason as every variable
          # above: `readPromptContract` rejects an unrecognised value, so a dispatch
          # that named a rendering while this line was absent would run the baseline,
          # complete successfully, and publish a `b-to-f-repairs` of zero reading as
          # evidence that the rendering does not help.
          #
          # It is the only variable that changes what the model is shown. The five
          # above are held at their dispatched values on purpose: if this switch also
          # moved a gate, a non-zero MR/TR could not be attributed to either change,
          # and the run would answer neither question.
          CORTEX_MEMORY_PROMPT_CONTRACT: ${{ github.event.inputs.cortex_memory_prompt_contract }}
          # Section 13's variable, passed the same way. It is a second axis rather than
          # a value of the contract above: the contract selects a rendering, this
          # selects an instruction block, and the ask experiment holds the rendering at
          # whatever the dispatch names. Passed unconditionally because the product
          # defaults a blank to `route`, and defaulting here instead would put the same
          # default in two places -- which is how the two would eventually disagree.
          CORTEX_MEMORY_ASK: ${{ github.event.inputs.cortex_memory_ask }}
          # Section 13.17's variable, passed the same way and for the same reason: the
          # product defaults a blank to `none` (the arrival-order prefix every prior
          # artifact was produced with), and defaulting here instead would put the same
          # default in two places -- which is how the two would eventually disagree
          # about whether a run had ranked anything.
          #
          # It is a SELECTION input, not an admission input: `confidenceFor` decides
          # which turns survive the write gate and this decides which admitted turns
          # the prompt budget buys, so moving it cannot change an admission decision.
          # That separation is what keeps a non-zero delta attributable to one change.
          # Section 13.115's switch, on its own line for the reason every other arm input is: the
          # product defaults a blank to off, and defaulting here instead would put the same default in
          # two places. `on` turns the cross-encoder on for this arm ONLY -- the reference pipeline's
          # switch is `CORTEX_RERANK`, which stays unset, so the paired control keeps the shipped
          # ranking and the delta measures the stage rather than a reranked pair.
          CORTEX_MEMORY_RERANK: ${{ github.event.inputs.cortex_memory_rerank }}
          CORTEX_MEMORY_RELEVANCE: ${{ github.event.inputs.cortex_memory_relevance }}
          # The width the index is built at, on its own line rather than folded into
          # the signal because the two are different claims: the name says a ranking
          # ran and this says how much of the context it scored. Passed unconditionally
          # for the reason above -- the arm defaults a blank to the index's own default,
          # and a second copy of that default here is how the two would drift.
          CORTEX_MEMORY_RELEVANCE_TOP_K: ${{ github.event.inputs.cortex_memory_relevance_top_k }}
          # The unit the budget is spent in, on its own line for the same reason the
          # width is: the signal says how a turn was scored and this says what a score
          # bought, and section 13.27 moves only this one. Passed unconditionally --
          # the arm defaults a blank to `turn`, and a second copy of that default here
          # is how the two would drift.
          CORTEX_MEMORY_RELEVANCE_UNITS: ${{ github.event.inputs.cortex_memory_relevance_units }}
          # Section 13.68's variable, passed the same way. Blank means no cap, which is the
          # state every archived run was produced under; the arm refuses anything below 1
          # rather than reading it as "unset", because a cap of 0 would leave the evidence
          # section holding turn numbers with no text while every coverage count still
          # reported a delivery.
          CORTEX_MEMORY_MAX_TURN_CHARS: ${{ github.event.inputs.cortex_memory_max_turn_chars }}
          # Section 13.73's reach, passed the same way. Blank means every route, which is what
          # section 13.68 shipped; the arm also accepts `all` and `none`, and rejects any name it
          # does not know rather than ignoring it.
          CORTEX_MEMORY_MAX_TURN_CHARS_ROUTES: ${{ github.event.inputs.cortex_memory_max_turn_chars_routes }}
          # Section 13.81's budget. Blank means the product's 24000; the arm rejects 0 rather than
          # reading it as "unset".
          CORTEX_MEMORY_MAX_PROMPT_CHARS: ${{ github.event.inputs.cortex_memory_max_prompt_chars }}
          # Section 13.83's filter. Blank means every role, which is the state every archived run
          # is in; the arm rejects an unknown role and rejects `none`, because an empty role set
          # admits nothing and would be reported as a dataset with no evidence.
          CORTEX_MEMORY_EVIDENCE_ROLES: ${{ github.event.inputs.cortex_memory_evidence_roles }}
          # Section 13.94's second consultation. Blank means none, which is the state every archived
          # run is in; the arm rejects anything but none/audit rather than defaulting.
          CORTEX_MEMORY_REVIEW_PASS: ${{ github.event.inputs.cortex_memory_review_pass }}
          # Section 13.101's sample count. Blank means one consultation; the arm rejects anything but
          # none/3 rather than clamping, because a silently-clamped run would publish the control's
          # reading under the treatment's name.
          CORTEX_MEMORY_SELF_CONSISTENCY: ${{ github.event.inputs.cortex_memory_self_consistency }}
          # Section 13.97's expansion. Blank means the bare question; the arm rejects anything but
          # none/llm rather than defaulting, because a run that silently ran the control would
          # publish an unchanged result reading as evidence that expansion does not help.
          CORTEX_MEMORY_QUERY_EXPANSION: ${{ github.event.inputs.cortex_memory_query_expansion }}
          # Section 13.83's reach, passed the same way. Blank means every route; the untouched
          # routes are this experiment's control.
          CORTEX_MEMORY_EVIDENCE_ROLES_ROUTES: ${{ github.event.inputs.cortex_memory_evidence_roles_routes }}
          # The per-pass ceiling, passed the same way. Blank means no ceiling, and the
          # arm rejects a non-positive one rather than reading it as "unset".
          # Section 13.12's bound, passed the same way. It is what keeps the run from
          # dying at the JSON write: run 38003036421 graded all four runs of all five
          # hundred questions and then lost the whole measurement to
          # `RangeError: Invalid string length`. Passed unconditionally because the arm
          # defaults a blank to unbounded, and defaulting here instead would put the
          # same default in two places.
          # Section 13.12's record bound, fixed at the value section 13.15 raised it to. It is a
          # WRITABILITY guard rather than a measurement -- the roster now carries the prompt's own
          # evidence, which the budget already bounds, so the bound exists to keep the JSON writable --
          # and it has not been varied since. It is therefore a constant here rather than an input: the
          # workflow now sits AT GitHub's 25-input ceiling (§13.97 consumed the last position), and this
          # is the one knob whose value no experiment reads. Restoring it as an input is the right move
          # if a run ever needs to move the bound, and it costs nothing but this comment -- but it now
          # costs a dispatchable variable, so the two have to be traded rather than added.
          CORTEX_MEMORY_EVIDENCE_TURNS: '256'
          # The pre-registered scale. `limit: 0` is the full 500 questions and
          # `ablation_runs: 4` is the run count the pre-registration fixes; both are
          # read from the same dispatch inputs the job already carries, so a dispatch
          # that sets them at the workflow level cannot disagree with this step.
          #
          # RUNS is deliberately NOT forwarded. The arm reads `ABLATION_RUNS`, not `RUNS`.
          #
          # This comment used to claim that a second repetition "replays the first run's cached
          # answers and costs full wall-clock for a byte-identical report", and it was the reason
          # this input defaulted to 1. Run `40722772896` falsifies both halves: four repetitions of
          # one configuration produced totals of 407 / 414.5 / 414.5 / 423 and MR counts spanning
          # 81 to 88, at 2.87x the wall clock of a single pass. A byte-identical report has
          # min = max. The default is now 4, because a one-repetition artifact cannot say whether
          # a difference is the treatment or the sampling -- and that is exactly how §13.118's
          # control came to be unreadable against its own treatment.
          LIMIT: ${{ github.event.inputs.limit || '60' }}
          ABLATION_RUNS: ${{ github.event.inputs.ablation_runs || '4' }}
          TEMPERATURE: ${{ github.event.inputs.temperature || '0' }}
          # The reader is shared by both sides, so the model and the thinking mode have
          # to reach this step too. Omitting them would run the arm's two sides on a
          # different reader from the primary benchmark's, which makes the two reports
          # incomparable for the one reason the pre-registration pins.
          DEEPSEEK_MODEL: ${{ github.event.inputs.model || 'deepseek-chat' }}
          DEEPSEEK_THINKING: ${{ github.event.inputs.thinking || 'disabled' }}
          EMBEDDING_BATCH_INTERVAL_MS: ${{ github.event.inputs.embedding_batch_interval_ms || '0' }}
        run: pnpm --filter @agentix-e/cortex-memory bench

      # The key carries the run id, and the restore above matches on the dataset-hash
      # PREFIX -- which is the pattern `actions/cache` documents and the repair for a
      # measured waste.
      #
      # Both of the failed runs of this workflow lost the vectors they had just paid for:
      # `38520676669` and `38566578567` each ended with
      #
      #     Failed to save: Unable to reserve cache with key longmemeval-embedding-<hash>,
      #     another job may be creating this cache.
      #
      # because the save re-used the exact key the restore had asked for. Two runs that
      # write one key contend for it, and the loser's vectors are discarded -- which is the
      # opposite of what the failure path deliberately does (`persistEmbeddingCache` runs
      # on the way out precisely because "a run that dies at question 300 of 500 has still
      # paid for its embeddings").
      #
      # ## What this key change did NOT achieve until 2026-10-17
      #
      # A unique save key cannot contend. But it also was not read, because the restore
      # above kept asking for the ORIGINAL bare key as its primary key -- see the block
      # quoted above `Restore embedding cache`. The cache list is the proof:
      # `last_accessed_at == created_at` on every run-keyed entry, so the prefix path had
      # never run, so the ~1.1 GB cache each run saved was read by nothing.
      #
      # The two flaws are one change because they interact. Repairing the key alone would
      # have made the NEWEST entry the one every run reads -- and the two newest run-keyed
      # entries in the store were 216 and 212 bytes, written by runs that died before they
      # restored. `persistEmbeddingCache` now refuses to publish an empty cache, which is
      # the other half.
      #
      # `run_attempt` is in both keys so a re-run resumes from its predecessor: the primary
      # key misses, the prefix resolves to the most recently created entry, and the vectors
      # the failed attempt paid for are the ones it starts from.
      - name: Save embedding cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/data/embedding-cache.bin
          key: longmemeval-embedding-${{ hashFiles('data/longmemeval_s_cleaned.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      # The artifact name is deliberately the one `benchmark.yml` uses. The fetch
      # tooling resolves by name, and a run of either workflow is "the report of the
      # measurement I just dispatched" -- so a second name would make every reader
      # learn which workflow produced it before it could download it.
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longmemeval-s-report
          # Glob the whole report set instead of enumerating filenames: an explicit
          # list silently dropped the P3b entity-graph ablation report (it ran, but was
          # never uploaded), which would have made an ablation result unrecoverable had
          # the run been the only record.
          path: |
            packages/cortex-memory/benchmark-*.md
            packages/cortex-memory/benchmark-*.json
            packages/cortex-memory/benchmark-error.log
          retention-days: 30

      # §13.107. Three defects in three rounds were found by a person reading an artifact and
      # none of them by a test: a `vote=0/0/0` census on a run that never voted, a reach table
      # that disagreed with the fallthrough implementing it, and a census that counted
      # consultations instead of questions once voting was on. Each is a disagreement between
      # two fields of **one** run, so each is decidable without a control -- which is exactly
      # why this belongs here rather than in the reading step, where it was three times too late.
      #
      # It runs after the upload and with `if: always()`, so the artifact is published either
      # way: the job's colour is the signal that this run's own fields contradict each other,
      # and the artifact is still there to be read. A red job with a recoverable report is the
      # right pair; a green job with a self-contradicting report is how the last three defects
      # reached a document.
      - name: Audit the artifact against itself
        if: always()
        run: |
          python3 tools/readout-arm-run.py --audit \
            packages/cortex-memory/benchmark-cortex-memory-ablation-report.json
