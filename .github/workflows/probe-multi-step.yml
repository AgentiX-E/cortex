# The multi-step retrieval probe, dispatched by hand and never by a commit.
#
# `packages/cortex-agent/bench/probe-multi-step.ts` answers one question and only one: does a reader
# that chooses its own evidence find gold turns the single-shot seed search does not? It is the
# cheap arm -- one decision call per question, ~1.5k prompt characters, no answer call -- and its
# whole purpose is to decide whether the expensive two-step arm is worth buying. The reading it
# produces is a pre-registered criterion in `cortex-docs/docs/03-execution-plan.md` §14.98.8: a
# `gainedQuestions` of at least five dispatches the two-step arm, and anything less cancels it.
#
# ## Why this is a workflow and not a local command
#
# The corpus is 100+ MB, served from a moving branch of a HuggingFace dataset, and the only
# credentials in this repository are organisation secrets that exist on a runner. A probe run on a
# laptop would measure a different corpus with a different key and the artifact would say neither.
# Every other measurement in this repository follows the same rule, which is why the download step
# below is a copy of `benchmark.yml`'s rather than a paraphrase of it: two workflows that download
# the corpus different ways produce two populations and no comparison.
#
# ## Why it is not wired to `push`
#
# The standing instruction is that competitor and model measurements are dispatched on demand and
# recorded, never fired by a commit: each run spends real money and a number nobody asked for is a
# number nobody reads. `verify.yml` is the workflow that runs on push, and it runs `pnpm check` --
# which is why this file does not, and why the dispatcher checks that verdict instead (`§14.98.11`).
name: Multi-step retrieval probe

on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'Reader steps as MODEL CALLS (0 = one seed search and no decision call, the control arm)'
        required: false
        default: '1'
        type: string
      capability:
        description: 'LongMemEval-S capability to probe (MR = multi-session reasoning, the target)'
        required: false
        default: 'MR'
        type: string
      limit:
        description: 'Questions to probe (0 = the whole capability population)'
        required: false
        default: '0'
        type: string
      corpus_sha256:
        description: 'Expected SHA-256 of longmemeval_s_cleaned.json (empty = accept whatever the branch serves)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  probe:
    name: Reader probe (multi-session reasoning)
    runs-on: ubuntu-latest
    # The measured cost of the full population at one step is about 0.09 CNY and a few minutes. An
    # hour is not a budget, it is the point at which a hung socket has to become a failed run rather
    # than a run that bills until someone notices.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No Python setup, because this job runs no Python. It did for exactly one dispatch, while it
      # also ran `pnpm check`; see the note below the build for why that step is gone. The rule that
      # put it here (`tools/ci-gate-audit.py`'s `check-prerequisites`) still applies to every workflow
      # that runs the suite -- it simply has nothing to ask of one that does not.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # The suite is deliberately NOT run here, and this step is where that decision is recorded
      # rather than left as an absence.
      #
      # The first two dispatches tried to buy provenance by re-running `pnpm check` before measuring.
      # Neither reached the probe. `44863794098` died at `pnpm test:tools` for want of pytest;
      # `44865288439`, with pytest installed, died at `test_semantic_carry_analysis` because that
      # suite reads a **sibling repository** (`cortex-docs/evidence/longmemeval/scripts/`) which
      # `verify.yml` checks out at `path: cortex-docs`. Each omission cost a dispatch, and the list of
      # preconditions is not the kind of thing a copy of four steps can be trusted to carry: `verify.yml`
      # builds it over a dozen steps across two jobs.
      #
      # Duplicating a suite is the wrong repair when the suite already runs on push for the same
      # commit. `verify.yml` runs on `push` and `pull_request`, so the tree this job measures has a
      # verdict of its own, keyed by the SHA the run records. Provenance is therefore *checked at the
      # dispatch* rather than *re-derived here*: `tools/dispatch-multi-step-probe.py` refuses to
      # dispatch unless `verify.yml` concluded success for the head of `master`, which is the ref this
      # workflow is dispatched against. One verdict per commit, and the refusal happens before any
      # money is spent rather than after ten minutes of duplicated work.
      - name: Download LongMemEval-S
        env:
          CORPUS_SHA_INPUT: ${{ github.event.inputs.corpus_sha256 }}
        run: |
          mkdir -p "${{ github.workspace }}/data"
          curl -fL --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            -o "${{ github.workspace }}/data/longmemeval_s_cleaned.json" \
            "https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json"
          ACTUAL_SHA="$(sha256sum "${{ github.workspace }}/data/longmemeval_s_cleaned.json" | cut -d' ' -f1)"
          echo "corpus sha256: $ACTUAL_SHA"
          echo "corpus bytes : $(stat -c%s "${{ github.workspace }}/data/longmemeval_s_cleaned.json")"
          EXPECTED="$CORPUS_SHA_INPUT"
          if [ -n "$EXPECTED" ] && [ "$EXPECTED" != "$ACTUAL_SHA" ]; then
            echo "::error::corpus hash mismatch: expected $EXPECTED, got $ACTUAL_SHA"
            exit 1
          fi
          # Recorded beside the probe output rather than inside it: `src/probe.ts` is inside the
          # coverage boundary and decides what a reading is, and a corpus digest is a property of the
          # run, not of the measurement. Keeping them apart is what lets the report type stay a pure
          # function of the cases.
          printf '%s  longmemeval_s_cleaned.json\n' "$ACTUAL_SHA" > "${{ github.workspace }}/probe-corpus.sha256"

      - name: Probe the reader
        # Dispatch inputs reach the shell through `env`, never through string interpolation: an input
        # is user-controlled and interpolation into a command is how an input becomes code.
        env:
          LONGMEMEVAL_PATH: ${{ github.workspace }}/data/longmemeval_s_cleaned.json
          PROBE_STEPS: ${{ github.event.inputs.steps }}
          PROBE_CAPABILITY: ${{ github.event.inputs.capability }}
          PROBE_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          set -o pipefail
          # The output path is absolute on purpose. `pnpm --filter` runs the script with the
          # package directory as its working directory, so a relative `--out` lands in
          # `packages/cortex-agent/` -- one level below the paths `upload-artifact` resolves against
          # the workspace root. Run `44867629266` did exactly that: the probe succeeded, the log was
          # uploaded, and the per-case JSON silently was not, because `if-no-files-found` was `warn`.
          pnpm --filter @agentix-e/cortex-agent probe:multi-step -- \
            --steps "$PROBE_STEPS" \
            --capability "$PROBE_CAPABILITY" \
            --limit "$PROBE_LIMIT" \
            --out "$GITHUB_WORKSPACE/multi-step-probe.json" 2>&1 | tee probe-output.log

          # The step summary is what a reader sees without downloading anything, and the criterion is
          # printed next to the reading so the decision does not have to be looked up in a document
          # that may have moved. It is not a gate: a `gainedQuestions` of zero is a finding, not a
          # failure, and a red run for a clean negative result would train the reader to re-dispatch
          # until the number looked better.
          {
            echo '### Multi-step retrieval probe'
            echo ''
            echo '```'
            cat probe-output.log
            echo '```'
            echo ''
            echo 'Pre-registered criterion (§14.98.8): `gainedQuestions >= 5` dispatches the two-step arm.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe reading
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-step-probe
          path: |
            multi-step-probe.json
            probe-output.log
            probe-corpus.sha256
          # `error`, not `warn`: a reading whose per-case rows are missing is a summary, and the
          # reason `44867629266` looked complete is that a missing file only produced a warning.
          if-no-files-found: error
