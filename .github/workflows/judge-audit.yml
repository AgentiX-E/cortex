name: Judge audit

# How often does this repository's judge accept an answer that is wrong?
#
# Every accuracy number this project publishes is the judge's opinion, and the campaign's effects are
# two or three questions on a 121-question capability. The published audit of LoCoMo's gold answers
# reports that a standard judge (`gpt-4o-mini`, official prompt) **accepted 62.81%** of answers that
# were topical but wrong. If this judge behaves like that, `§10.1` has been comparing arms by a
# quantity whose error is larger than every difference it reports.
#
# The instrument is `tools/judge-audit.mjs`: it perturbs answers the judge already accepted, in three
# ways that are wrong by construction, and re-submits them with the same templates. `--plan-only` runs
# with no model and no key, which is why the case list can be reviewed in a pull request while the
# rate can only be produced here.
#
# Dispatch only, never on push: it spends credits and its reading is only meaningful against a
# specific artifact, which is an input rather than a constant.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Benchmark run id whose `longmemeval-s-report` artifact is audited'
        required: true
        type: string
      limit:
        description: 'Accepted answers to audit (each yields up to three cases plus one control call)'
        required: false
        default: '120'
        type: string
      model:
        description: 'Judge to grade with, as `provider:model` or a bare model id. EMPTY (the default) means the artifact records it: the re-grade then describes the judge that graded the artifact, which is the only reading this workflow was built for. Naming one is a judge-sensitivity experiment, not a correction, and the reading says so'
        required: false
        default: ''
        type: string
      mode:
        description: 'false-accept (perturb answers the judge accepted, measure bias) or regrade (re-ask about the same answers, measure variance). The two readings are different quantities and are never summed'
        required: false
        default: 'false-accept'
        type: string
      passes:
        description: 'Regrade only: how many times each recorded answer is re-judged. Below 2 there is no second reading and the flip rate would be zero by construction'
        required: false
        default: '2'
        type: string
      population:
        description: 'Regrade only: all, preference, or non-preference. A preference gold states what a good answer should do rather than the answer, so its verdict is never mechanical; section 13.310 registers the split because that 5.8% of the dataset carried 42% of one reader-vs-reader gap'
        required: false
        default: 'all'
        type: string
      scorer:
        description: 'Regrade only: judge (the judge channel alone) or full (judgeScorer, the instrument the artifact itself used). The default is judge because every archived regrade reading in this campaign was taken with it, and a different instrument under the same name would silently re-label them. Use full when the reading is an ARM comparison rather than a judge-variance measurement: for the five non-preference capabilities the channel alone submits answers to the model that `exact` would have decided, so it is not the artifact accuracy (section 13.312.8, J8)'
        required: false
        default: 'judge'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: judge-audit-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  audit:
    name: False accepts on provably wrong answers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Dispatch inputs enter through the environment rather than through script text: the runner
      # substitutes an expression into a `run:` block BEFORE bash parses it, so a quote in a value
      # would edit the program. `--limit "$LIMIT"` cannot.
      LIMIT: ${{ inputs.limit }}
      RUN_ID: ${{ inputs.run_id }}
      # `createLlmFromEnv` — the factory the judge is built from — reads `DEEPSEEK_API_KEY` by that
      # name (`packages/cortex-eval/src/llm-factory.ts:92`), not the profile variables the authoring
      # tools use. The first dispatch of this workflow set only `CORTEX_LLM_*` and died on
      # "DEEPSEEK_API_KEY is required for natural-language benchmark" after the plan step had already
      # passed — which is the one failure mode a configuration mistake produces here that a reader
      # could mistake for the audit finding nothing.
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # `CORTEX_JUDGE_MODEL`, not `CORTEX_LLM_MODEL`. The latter is `cortex-ai`'s profile variable
      # (`packages/cortex-ai/src/profile.ts`), read by `resolveLlmProfile` in the *other* generation
      # path; the factory this workflow builds its judge from reads the reader's selection and its own
      # pin, and neither is `CORTEX_LLM_MODEL`. So every audit dispatched before this line existed
      # graded with the default model whatever the input said -- an unset variable is not an error,
      # which is exactly why the mistake survived three rounds of readings (§13.312).
      #
      # Left empty, `tools/judge-identity.mjs` fills it from the artifact's own
      # `memoryArmConfig.judge` (or `.reader` for artifacts written before the two were separate), so
      # the re-grade cannot describe a judge the artifact did not use.
      CORTEX_JUDGE_MODEL: ${{ inputs.model }}
      GH_TOKEN: ${{ github.token }}
      # Two readings of one artifact, never one run of both: `false-accept` perturbs answers to price
      # the judge's bias, `regrade` re-asks about unchanged answers to price its variance. Adding them
      # would produce a number whose two halves are not the same quantity.
      MODE: ${{ inputs.mode }}
      PASSES: ${{ inputs.passes }}
      # Derived once, here, so the plan step and the reading step cannot grade different populations.
      POPULATION_FLAG: ${{ inputs.population == 'preference' && '--preference-only' || (inputs.population == 'non-preference' && '--non-preference-only' || '') }}
      SCORER: ${{ inputs.scorer }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Refuse to start without a credential
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "DEEPSEEK_API_KEY is empty: the org secret DEEPSEEK_API_KEY is not visible to this job" >&2
            exit 1
          fi
          echo "credential present (length ${#DEEPSEEK_API_KEY}); value never printed"
          # The judge's name is not a credential, so it is printed. An unnamed judge is the defect
          # §13.312 registers, and the one place it can be caught before spending credits is here.
          echo "judge requested: ${CORTEX_JUDGE_MODEL:-<the judge this artifact recorded>}"

      - name: Fetch the artifact under audit
        run: |
          set -euo pipefail
          mkdir -p readings/artifact
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name longmemeval-s-report --dir readings/artifact
          ls -la readings/artifact

      - name: Plan only (no model) — the case list has to be reviewable before it is spent on
        if: env.MODE != 'regrade'
        run: |
          set -o pipefail
          node tools/judge-audit.mjs \
            --artifact readings/artifact/benchmark-cortex-memory-ablation-report.json \
            --limit "$LIMIT" --plan-only 2>&1 | tee readings/plan.txt

      - name: Audit
        if: env.MODE != 'regrade'
        run: |
          set -o pipefail
          node tools/judge-audit.mjs \
            --artifact readings/artifact/benchmark-cortex-memory-ablation-report.json \
            --limit "$LIMIT" \
            --out readings/judge-audit.json 2>&1 | tee readings/judge-audit.txt

      # The variance half. It costs `questions * passes` judge requests and buys the split §13.255.3
      # could not make: how much of the arm's noise floor belongs to the judge rather than the reader.
      #
      # The plan runs first and unconditionally, because the one failure this job can produce that
      # looks like a result is a two-pass loop whose second pass never asked: `createLlmJudge`
      # memoises, and the tool clears that cache between passes. A job that skipped the plan would
      # report 0.0% and read as a perfectly reproducible judge.
      - name: Plan the regrade (no model)
        if: env.MODE == 'regrade'
        run: |
          set -o pipefail
          node tools/judge-regrade.mjs \
            --artifact readings/artifact/benchmark-cortex-memory-ablation-report.json \
            --limit "$LIMIT" --passes "$PASSES" $POPULATION_FLAG --scorer "$SCORER" --plan-only \
            2>&1 | tee readings/regrade-plan.txt

      - name: Regrade the recorded answers
        if: env.MODE == 'regrade'
        run: |
          set -o pipefail
          node tools/judge-regrade.mjs \
            --artifact readings/artifact/benchmark-cortex-memory-ablation-report.json \
            --limit "$LIMIT" --passes "$PASSES" $POPULATION_FLAG --scorer "$SCORER" \
            --out readings/judge-regrade.json --verdicts readings/judge-verdicts.json \
            2>&1 | tee readings/judge-regrade.txt

      - name: Upload readings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-audit
          path: readings/
          if-no-files-found: warn
