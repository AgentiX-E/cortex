name: Verify

# The library gate, run on every push and pull request.
#
# Until this workflow existed the repository had exactly one workflow, and it was
# `workflow_dispatch` only. So `pnpm check` -- the command that runs the unit
# tests, the coverage floors, the lint, the typecheck, the export census and the
# formatting check -- ran on demand and never automatically. Every "CI is green"
# in the delivery log was a run somebody dispatched, and a push that broke the
# build produced no signal at all until the next dispatch.
#
# That is the defect this file fixes, and it is the same class as the ones the
# delivery log keeps recording: a check that is not attached to the event it is
# supposed to guard. A gate you have to remember to run is a gate that is not
# running.
#
# Kept separate from `benchmark.yml` rather than added to its triggers, because
# the two have opposite shapes. This one must run on every push and finish in
# minutes; the benchmark needs the LongMemEval corpus, network model downloads
# and up to four hours, and is dispatched deliberately. Triggering the second
# from the first would either make every push a four-hour job or force the
# benchmark to be disabled for pushes, and both end with the gate turned off.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push that supersedes another makes the superseded run pointless: only the
# newest commit's result is actionable, and letting the old ones finish spends
# runner minutes on a verdict nobody will read.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Verify library
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The sibling repository, checked out where the tools expect it.
      #
      # `tools/__tests__/test_semantic_carry_analysis.py` runs
      # `cortex-docs/evidence/longmemeval/scripts/semantic_carry_analysis.py` as a subprocess,
      # because that script is what decides whether `S12` gets a registered number or none -- the
      # branch a screening pair must not take. A test that skipped when the script was absent would
      # be a test of nothing on the only machine that matters, and the first push proved it: 13
      # tests failed here with "No such file or directory" while passing locally, where the two
      # repositories sit side by side.
      #
      # Public, so no credential is involved; `fetch-depth: 1` because the test reads one file.
      #
      # `path` resolves against `$GITHUB_WORKSPACE`, so this lands at `cortex/cortex-docs` -- inside the
      # checkout, not beside it as on a developer's machine. The test resolves both roots; the first
      # attempt wrote `path: cortex-docs` and assumed it meant `../cortex-docs`, which it does not.
      - name: Checkout cortex-docs
        uses: actions/checkout@v4
        with:
          repository: AgentiX-E/cortex-docs
          path: cortex-docs
          fetch-depth: 1

      # The `tools/` Python scripts are part of the delivery path, not scratch
      # work: one publishes to GitHub, one dispatches the benchmark, and one
      # makes the resolver usable. `pnpm check` runs their tests, so the
      # interpreter and pytest have to be present before it does. Without this
      # step the run fails with an empty stdout, which is what happened the first
      # time these tests reached CI.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: python3 -m pip install --requirement tools/requirements-dev.txt

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify library
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee check-output.log

      # The job log is served from a host the development sandbox cannot reach,
      # so a failure otherwise reports only "the step exited non-zero". `tee`
      # writes the transcript to the workspace and this uploads it, which is what
      # makes a red run diagnosable without a second dispatch.
      #
      # `if: always()` because the artifact matters precisely when the step above
      # failed. A `.gitattributes` rule marks `*.log` as binary so the size of a
      # green transcript stays small in the artifact store.
      - name: Upload check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-output
          path: check-output.log
          if-no-files-found: ignore

  # The PostgreSQL gate: `PgStorage` against a real server.
  #
  # ## Why this job exists, and what it replaced
  #
  # `packages/cortex-storage/src/__tests__/storage.test.ts` used to say, at its failed-transaction
  # test, that the rollback's effect "is asserted against a real PostgreSQL instance in the
  # integration suite". No such suite existed; `grep -rn 'integration suite' .` matched that comment
  # and nothing else. `pg-mem` was not PostgreSQL in two ways that mattered: it does not implement
  # `ROLLBACK`, and it cannot express the prefix filter's escaping. So the adapter's transaction and
  # predicate behaviour were covered by an engine that had no opinion about them, and the coverage
  # number -- 100% on `pg.ts` -- recorded that the lines ran, not that the server agreed.
  #
  # When the suite was finally written it failed on its first run, on four assertions. Three were
  # real defects in the adapter: a transaction read an expired row the non-transactional path hides,
  # `put` left dead rows that `SqlStorage.#put` purges, and `close()` raised `pg`'s message instead
  # of the package's `StorageClosedError`. The fourth was this suite's own assumption about `JSONB`
  # key order, which is now recorded as a property rather than asserted as insertion order.
  #
  # ## Why the container, and not a service installed in the step
  #
  # `apt-get install postgresql` works -- it took 25 seconds when this was measured -- but it leaves
  # the job depending on whatever version the runner image happens to carry, and it needs a cluster
  # started by hand with its own failure modes. The service container pins the major version, and
  # `--health-cmd` makes "the server is up" a declared condition rather than something the first
  # `SELECT` discovers by failing.
  #
  # ## Why the count check is a separate step
  #
  # `vitest run` exits 0 when every test is skipped, and the suite skips itself when
  # `CORTEX_PG_URL` is unset. Deleting the `env:` block above would therefore produce a green job
  # that asserted nothing -- which is the same shape as the defect this whole job answers. The count
  # check reads the JSON reporter and fails on a skip, a short count or a missing report.
  postgres:
    name: Verify against PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex
          POSTGRES_DB: cortex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cortex -d cortex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Trust is not configured: the container's health check and the suite both authenticate with
      # the password above, so the gate runs against the same authentication path a deployment does.
      CORTEX_PG_URL: postgresql://cortex:cortex@localhost:5432/cortex
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The suite imports `src/`, so a build is not strictly required -- but `pnpm -r build` is what
      # the package's own `check` does first, and a type error in `pg.ts` should fail here with a
      # compiler message rather than as an assertion failure three steps later.
      - name: Build
        run: pnpm build

      - name: Run the integration suite
        run: |
          set -o pipefail
          pnpm --filter @agentix-e/cortex-storage test:pg 2>&1 | tee pg-output.log

      - name: The suite ran, and asserted something
        run: node tools/pg-integration-count.mjs /tmp/cortex-pg-report.json

      - name: Upload the transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-output
          path: |
            pg-output.log
            /tmp/cortex-pg-report.json
          if-no-files-found: ignore

  # The two browser gates, run where a browser exists.
  #
  # `pnpm check` cannot reach them: one needs a bundler and a Chromium, the other needs a second
  # engine, and neither is present in the library job. Until this job existed their evidence was a
  # committed JSON file and a paragraph in the delivery log, which is the shape of gate this project
  # keeps finding un-attached -- `§10.2` items 1 and 2 were "closed" by hand-run probes, and a probe
  # that only runs when someone remembers is a probe that is not running.
  #
  # The row count is smaller than the committed reading's 2,000 on purpose. 2,000 rows at ~60 ms per
  # commit is two minutes of runner time to prove arithmetic that the digest already proves; 400 keeps
  # the restart, the digest and the 24 checks, which is what the gate is about. The fresh reading goes
  # to /tmp so the committed file survives to be compared with it -- that comparison is the next step
  # and the reason the file is evidence rather than a log.
  browser:
    name: Verify browser suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The probe finds a browser through `CORTEX_CHROME` or the playwright cache, so installing
      # playwright's Chromium is enough; no automation library is imported by the suite itself, and
      # nothing here depends on `playwright` being a dependency of this repository.
      #
      # Pinned through `@1.49.1` and confirmed with `--yes` because `npx` in a non-interactive shell
      # otherwise behaves differently across npm versions, and a job that hangs on a prompt reports as
      # a timeout rather than as the missing browser it is.
      #
      # `--with-deps` is not used, and the reason is a failure rather than a preference: on
      # 2026-11-11 three attempts died in `apt-get` with `Temporary failure resolving
      # 'azure.archive.ubuntu.com'` before a single assertion ran, and the attempt eight minutes
      # earlier had installed the same browser and launched it. The flag buys distribution packages
      # the `ubuntu-latest` image already carries, at the price of a dependency on an apt mirror the
      # job does not otherwise need. It is not a weakening: the suites launch the browser themselves,
      # so a genuinely missing library fails the job at the first `spawn` with the library's name in
      # the message, which is a better failure than a resolver timeout.
      - name: Install a browser
        run: npx --yes playwright@1.49.1 install chromium

      - name: Build
        run: pnpm build

      - name: Run the browser suites
        env:
          CORTEX_ROWS: '400'
          CORTEX_RESULTS: /tmp/fresh-browser-run.json
          # A third override rather than a shared one: three suites write three readings, and one
          # variable would have them overwrite each other and the comparisons below report one
          # suite's checks against another's.
          CORTEX_RESULTS_CORPUS: /tmp/fresh-corpus-run.json
          # The fourth, and the one this job was missing. `bundle-probe.mjs` defaults to writing
          # `packages/cortex-storage/test/browser/bundle-run.json` -- the committed artefact -- so
          # every run of this job **overwrote the evidence in the workspace** and the artifact upload
          # then showed the fresh file where the committed one used to be. A run that disagreed with
          # the committed reading was therefore invisible: the file it would have disagreed with had
          # already been replaced. `bundle-probe.mjs`'s own comment described this comparison ("the
          # CI comparison would then report 24 checks against 4") three lines above a step that did
          # not exist. Measured by reading `git grep CORTEX_RESULTS_BUNDLE`: defined, never set.
          CORTEX_RESULTS_BUNDLE: /tmp/fresh-bundle-run.json
        run: pnpm test:browser

      # The fourth reading, and the first one that needs **two** targets on one profile. `onSecondTab`
      # exists because `openBrowserStorage` used to answer a second tab with a silent fallback to
      # IndexedDB -- two tabs, one origin, two sets of rows -- and the only way to know the claim works is
      # to ask a real browser for the same origin twice.
      #
      # `--check` in the same step because the artefact is a list of named checks rather than a tier and a
      # digest, and its comparator is the probe that wrote it. Running the flow twice to compare it with
      # itself would double the cost of the suite to learn what one run already knows.
      - name: The two-tab claim, re-derived and compared
        env:
          CORTEX_RESULTS_TWO_TAB: /tmp/fresh-two-tab-run.json
        # `node` rather than `pnpm --filter ... -- --check`: whether `--` reaches the script or is eaten by
        # the package manager is a per-version detail, and the failure mode is silent -- the probe would run,
        # write its reading, and exit 0 without comparing anything, which is the defect this step exists to
        # prevent one layer up.
        run: |
          node packages/cortex-storage/test/browser/two-tab-probe.mjs \
            --check --committed packages/cortex-storage/test/browser/two-tab-run.json

      # The general form of the bundle defect below: a probe that writes its reading back into the
      # checkout leaves one file that always agrees with itself. Asserted here, where the checkout
      # starts clean, rather than in `pnpm check`, where a developer's tree is dirty by definition.
      # The quota, created the only way a page cannot: the DevTools protocol. This step exists because
      # the first design for it was wrong in a way only a browser could reveal -- a one-byte write was
      # supposed to tell a full origin from a failing device, and at a zero quota that write still
      # succeeds (eight megabytes of it does). The three platform checks that record this are the
      # reason the class is `StorageUnavailableError` rather than `StorageFullError`, so they are
      # compared here exactly like the two-tab claim above.
      - name: The quota, re-derived and compared
        env:
          CORTEX_RESULTS_QUOTA: /tmp/fresh-quota-run.json
        run: |
          node packages/cortex-storage/test/browser/quota-probe.mjs \
            --check --committed packages/cortex-storage/test/browser/quota-run.json

      - name: The suites wrote nothing into the checkout
        run: node tools/readings-in-place.mjs

      - name: The committed reading still describes this tree
        run: |
          node tools/browser-reading-check.mjs \
            --committed packages/cortex-storage/test/browser/last-run.json \
            --fresh /tmp/fresh-browser-run.json

      # The corpus reading is a second committed artefact, so it needs the same treatment: the probe
      # re-runs here, writes somewhere else, and this compares the two. Without it the committed file
      # would be a log of a run nobody repeats.
      - name: The committed corpus reading still describes this tree
        run: |
          node tools/browser-reading-check.mjs \
            --committed packages/cortex-memory/test/browser/corpus-run.json \
            --fresh /tmp/fresh-corpus-run.json

      # The bundle reading is the third, and the only evidence for the `workerUrl` contract -- it
      # quotes the product's refusal text as its first check. It records its tier and its digest in
      # its own shape (`facts.tier`, `facts.roundTrip`), which is why the reader had to learn that
      # shape before this step could exist at all.
      - name: The committed bundle reading still describes this tree
        run: |
          node tools/browser-reading-check.mjs \
            --committed packages/cortex-storage/test/browser/bundle-run.json \
            --fresh /tmp/fresh-bundle-run.json

      - name: Upload the readings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-readings
          path: |
            /tmp/fresh-browser-run.json
            /tmp/fresh-corpus-run.json
            /tmp/fresh-bundle-run.json
            /tmp/fresh-two-tab-run.json
            /tmp/fresh-quota-run.json
            packages/cortex-memory/test/browser/corpus-run.json
          if-no-files-found: ignore

  # `§10.2` gate 2 -- "the browser tier's persistence reproduces on at least two engines" -- had one
  # artefact and no run. `last-run-firefox.json` is committed evidence, its **only** consumer was
  # `guard:browser` in `pnpm check`, and that consumer compares it to the Chromium reading: two
  # artefacts agreeing with each other about a tree neither of them had to describe. `git grep
  # firefox .github/workflows` returned nothing, which is how this job came to be written.
  #
  # Playwright's Firefox is used for the same reason Playwright's Chromium is: one pinned download,
  # no `apt`, no system Firefox (which on `ubuntu-latest` is a snap and cannot be installed
  # non-interactively). The engine is Firefox 132, and the committed reading was taken on 159 --
  # which turned out to be worth knowing rather than a problem: a fresh 132 run reproduces all 24
  # checks, in order, on opfs, with a digest that matches, so gate 2's claim survives a 27-version
  # gap and this job keeps proving it.
  browser-firefox:
    name: Verify the browser suite on Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `findFirefox()` looks in `~/.cache/ms-playwright` first, so the install below is the whole
      # setup; `CORTEX_FIREFOX` exists for a hand-run against a release build and is not needed here.
      - name: Install Firefox
        run: npx --yes playwright@1.49.1 install firefox

      - name: Build
        run: pnpm build

      - name: Run the suite on Firefox
        env:
          CORTEX_ROWS: '400'
          CORTEX_RESULTS: /tmp/fresh-firefox-run.json
        run: pnpm --filter @agentix-e/cortex-storage test:browser:firefox

      - name: The suite wrote nothing into the checkout
        run: node tools/readings-in-place.mjs

      - name: The committed Firefox reading still describes this tree
        run: |
          node tools/browser-reading-check.mjs \
            --committed packages/cortex-storage/test/browser/last-run-firefox.json \
            --fresh /tmp/fresh-firefox-run.json

      - name: Upload the Firefox reading
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-readings-firefox
          path: /tmp/fresh-firefox-run.json
          if-no-files-found: ignore
