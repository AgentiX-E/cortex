# The paired ablations of the cognitive arm: the semantic carry (`S12`), the per-turn window (`S10`), and
# the boundary clock (§13.386).
#
# ## Why one workflow for three questions
#
# They need the same four things and differ in one input each: a population that can be split by corpus, a
# 6-second gate that is per **process** (so the split is the only lever on the wall clock), a merge that folds
# the parts back into one population, and a spend gate that prices the whole dispatch before the corpus
# download. A second workflow carrying its own copy of the shard matrix would be a second statement of that
# arithmetic, and the two would agree until one of them was edited -- the argument `arm-pairing.ts` makes for
# pairing two sides of one pass rather than two dispatches.
#
# | question | `pairing` | `turn_rendering` | population |
# | --- | --- | --- | --- |
# | `S12`, the semantic layer's carry | `carry` | `head` | two windows over one corpus, `KU` |
# | `S10`, the per-turn window | `reference` | `match` (and `head` as its control) | the registered 500, `all` |
# | `S10`, the marker alone | `reference` | `ellipsis` (against `head`) | the registered 500, `all` |
# | the boundary clock | `clock` | `head` | `MR` -- the route the clock's signature is enriched on |
#
# ## The semantic carry, in one paragraph
#
# ## Why a workflow of its own
#
# `benchmark-cortex-memory.yml` declares 24 inputs against GitHub's ceiling of 25, and
# `test_dispatch_inputs.py` refuses a workflow that reaches the ceiling -- so "add three inputs" is
# not available, and the file's own instruction for that case is to split rather than to remove a
# knob. It is also the right shape independently: this is not a dispatch of the arm's headline pair.
# It runs one system against itself with one flag between the two sides.
#
# ## The three facts this workflow exists to supply, none of which a dispatch of the registered
# ## population could
#
# 1. **Two windows over one corpus.** `updateAppliesTo` is a substring test on the record an update
#    was authorised by (`semantic-facts.ts:383`), and every LongMemEval-S question brings its own
#    haystack -- so on the registered population no question's window ever carries another
#    question's record and the reach is zero by construction (`AUDIT-SEMANTIC-REACH.md` §15.2).
#    `CORTEX_WINDOWS=2` asks each corpus twice: the first window absorbs, the second is the one a
#    carry can reach. `S13` is that reach, and it is why the population had to change before the row
#    could be read rather than dispatched again.
# 2. **The pair.** `CORTEX_MEMORY_AB=carry` puts the same cognitive system on both sides with
#    `semanticCarry` off on the baseline and on on the feature, so the delta is the carry's rather
#    than a difference between two systems. Two dispatches would pair two runs; this pairs two sides
#    of one pass, which is the invariant `PREREGISTRATION` §2.2 fixes for the whole arm (time-of-day
#    drift on this corpus is 1.7-2.1pp, larger than most effects an arm could find).
# 3. **A window that one store answers.** `Question.corpus` is a contract: a corpus's windows are
#    contiguous and are answered by one instance. The pool gives each worker its own `CortexMemory`,
#    so a second window answered by a second instance reads a store that never absorbed the first.
#    `claimRun` in `benchmark.ts` claims a whole corpus atomically, which is what makes `workers=4`
#    safe on this population rather than a way to erase the treatment.
#
# ## The one departure from the registered preset, and why it is not optional
#
# `cortex_memory_review_pass` is `supersede` here, not the registered `bare`. Absorption happens only
# in that pass, on that route (`memory.ts`'s `reviewPass === 'supersede' && route === 'knowledge-update'`),
# so a carry run on the registered pass would dispatch a mechanism with nothing to carry -- the exact
# "treatment administered, reached nothing" shape `S13` was added to refuse. The pass is on BOTH
# sides, so the pair still isolates the carry; what it does not isolate is the pass, and an artifact
# reading this line should say so. `memoryArmConfig.reviewPass` on the artifact is the check.
#
# ## Why `KU`
#
# The mechanism's reach is one route. `CORTEX_CAPABILITY=KU` grades the 78 knowledge-update questions,
# which are the population where a supersession can be the failure mode at all; the other 422
# questions cost a reader call each and cannot produce a `matched` window. A run over all 500 is the
# registered instrument and stays available through the input -- `windows=2, capability=all` -- and
# the `population` block on the artifact states which one ran.
name: Paired ablations (cortex-memory, one flag between the sides)

on:
  workflow_dispatch:
    inputs:
      shards:
        description: 'Jobs the population is split into. One Node process uses one core and run 43609290786 measured the same wall clock at 4 workers and at 32, so the split is the only lever. 1 is a single job; 16 is the first attempt at the registered population (1000 questions / 16 = ~63 per job). The split is by corpus (shard.ts), so both windows of a corpus stay on one instance and the merged result is the population rather than an average of parts'
        required: false
        default: '16'
        type: string
      windows:
        description: 'Windows per corpus. 2 is the population S13 names: the first window absorbs an update, the second is the one a carry can reach. 1 is the registered population, where the reach is zero by construction and the run is only useful as a control'
        required: false
        default: '2'
        type: string
      pairing:
        description: 'Which two systems the sides are. `carry` puts the same cognitive system twice with `semanticCarry` off against on -- S12''s instrument. `clock` puts the same cognitive system twice with `sessionClock` off against on -- the boundary clock''s instrument, and the same shape one flag over. `resolution` puts the same cognitive system twice with `resolution` at the registered `raw` against `layered` -- C7''s instrument, and the one pair whose delta is a rendering form''s rather than a switch''s. `reference` is the arm''s registered pair (the reference pipeline against the cognitive one), which is what S10 needs: its two sides are two dispatches of one configuration differing by the turn window, so neither side is a carry arm. `ask` puts the same cognitive system twice with each route''s reference instruction block on the control side and the block named in the `ask` input on the feature side -- the pair `13.291`''s adoption should have been priced with, and the one `PREREG-CLOCK-AXIS.md` 7 asked for after run 45636994046 charged an ask with a rendering. It renders `layered` on both sides, because pricing an ask at a rendering the product does not ship is the defect that reading was withdrawn for'
        required: false
        default: carry
        type: string
      ask:
        description: 'Which instruction block the reader is asked with, for `pairing=ask`. `verbatim-acts` is the block `13.291` adopted and therefore the default, which makes a bare `pairing=ask` dispatch the re-pricing of the shipped ask against each route''s reference block -- the reading the register has never had, because every ask number in it compares two artifacts and the one attempt to compare two asks (45636994046) moved the rendering as well. `route` is refused: it IS the control side, so naming it would produce a pair with the reference block on both. The value is also honoured by every other pairing, because it is the arm''s own variable rather than this workflow''s -- the default reproduces the literal it replaces byte for byte, and a dispatch that changes it is changing the prompt under a pairing that was not designed to measure it'
        required: false
        default: verbatim-acts
        type: string
      turn_rendering:
        description: 'How a capped turn is rendered. `head` is the registered rendering: the first 400 characters, cut silently (the default, and what every archived artifact used). `ellipsis` is the same cut with the omission printed -- it moves no characters, only the mark. `match` is the anchored window around the query match, and the product forces `ellipsis` for it, so a window that cut silently cannot be dispatched at all. The three are one input rather than two because `<window> + <marker>` admits a fourth combination the parser refuses, and an input that can only name the three legal renderings cannot produce it'
        required: false
        default: head
        type: string
      review_pass:
        description: 'The supersession pass. `supersede` is required by `pairing=carry` (absorption happens only in that pass, so a carry run on another pass has nothing to carry); `bare` is the registered preset, and it is what S10 measures'
        required: false
        default: supersede
        type: string
      fact_timeline:
        description: 'Whether a served fact also carries the interval it held -- `timeline: 30 dozen [2023/03/12 -> now]`, built from the two record instants the authorisation already returned (docs/USER-MANUAL.md 6.1.2). `1` requires `pairing=carry`: the product refuses to date a fact the prompt does not carry, and the arm refuses the combination before the first call rather than publishing a treatment that never executed. It costs no model call, so the delta it produces is attributable to the interval alone -- which is the one reading no prompt-axis experiment in this campaign has been able to make, because every previous candidate changed how much evidence the reader saw as well as what it said'
        required: false
        default: '0'
        type: string
      capability:
        description: 'Population selector, as in the arm: `KU` (the default) grades the 78 knowledge-update questions where a supersession can be the failure mode at all; `all` is the registered 500 and the instrument S12 is registered on. The other four codes the report prints are accepted too -- `IE`, `MR`, `TR`, `ABS` -- and a comma list is a union, so `IE,KU` is the 222-question population `PREREG-TRUNCATION-SHORT-ROUTES.md` registers. `MR` is the population `13.291`''s ask adoption was read on, and it is the one `pairing=ask` wants: the same 121 questions the 93.50-against-91.70 reading was taken on, at a fifth of the whole-volume price'
        required: false
        default: 'KU'
        type: string
      limit:
        description: 'Corpora to sample before the capability filter, 0 = the whole file. Sampled before the multiplication, so 0 and 78 mean the same population for `KU`'
        required: false
        default: '0'
        type: string
      ablation_runs:
        description: 'Repetitions. 2 is the screening default (78 corpora x 2 windows x 2 repetitions = 312 answers per side); S12 is registered at 4, which is the confirmation run'
        required: false
        default: '2'
        type: string
      model:
        description: "Reader model, optionally provider-prefixed exactly as the arm reads it ('deepseek-chat', 'zhipu:glm-4.6')"
        required: false
        default: 'deepseek-chat'
        type: string
      thinking:
        description: "Thinking mode: 'disabled', 'enabled', or a '+'-separated route list. Defaults to the registered `multi-session+temporal`. It used to default to `disabled` on the argument that a cheaper reader sharpens a two-sided comparison — that argument is about the *reader*, but the value is not free: the 87.00% reading this file published was taken with thinking off, `temporal` at 48,000 and `retrieval-anchored`, three departures from the registration that no gate could see because no gate read a workflow"
        required: false
        default: 'multi-session+temporal'
        type: string
      workers:
        description: 'Questions in flight **inside one shard**. A corpus is answered by one instance at any width (Question.corpus), so this moves the wall clock and not the treatment -- but it does not move it much, because the cost is CPU rather than waiting. Sized for a shard: 8 on 16 shards, 24-32 for a single-job dispatch'
        required: false
        default: '8'
        type: string
      budget_cny:
        description: 'The ceiling the spend gate enforces, in CNY, for the **whole dispatch** -- all shards together. The registered shape (capability=all, four repetitions, two windows) projects at 25-96 CNY depending on the cache mix, so this default is not the other dispatcher 3.00'
        required: false
        default: '120'
        type: string

permissions:
  contents: read

env:
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  CORTEX_MEMORY_BUDGET_MINUTES: '300'
  CORTEX_MEMORY_RERANK_BASE_URL: https://open.bigmodel.cn/api/paas/v4
  CORTEX_MEMORY_RERANK_MODEL: rerank
  CORTEX_MEMORY_RERANK_MAX_DOCUMENTS: '128'
  CORTEX_MEMORY_RERANK_MAX_DOCUMENT_CHARS: '4096'
  RERANK_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
  # The transport numbers the registered artifact carries, read from repository variables for the
  # reason the arm's own workflow gives: they are the pipe, not the experiment. An unset variable
  # interpolates to the empty string, which the parser reads as unset rather than as zero.
  CORTEX_LLM_MIN_INTERVAL_MS: ${{ vars.CORTEX_LLM_MIN_INTERVAL_MS }}
  CORTEX_LLM_RETRY_BUDGET_MS: ${{ vars.CORTEX_LLM_RETRY_BUDGET_MS }}
  CORTEX_READER_TIMEOUT_MS: ${{ vars.CORTEX_READER_TIMEOUT_MS }}

jobs:
  # The shard count expands into the matrix here rather than being written out as a literal list.
  # A hard-coded `[0, 1, ..., 15]` would make "16" a decision in this file instead of an input, and
  # the next attempt at this population (12 shards, or 4) would need a commit rather than a dispatch.
  plan:
    name: plan the shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.expand.outputs.matrix }}
    steps:
      - name: Expand the shard count into a matrix
        id: expand
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          python3 - "$SHARDS" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys

          raw = sys.argv[1].strip()
          # The same refusal `readShardPartition` applies, made before sixteen jobs are created: a
          # matrix that expands to nothing produces a run that succeeds without answering anything.
          if not raw.isdigit() or int(raw) < 1:
              raise SystemExit(
                  f"CORTEX_SHARDS must be a positive whole number of jobs: got {raw!r}. "
                  "One is a single job; the registered population is 16 on the first attempt."
              )
          count = int(raw)
          print("matrix=" + json.dumps({"shard": list(range(count)), "shards": [count]}))
          PY
          grep -q '^matrix=' "$GITHUB_OUTPUT" || {
            echo "::error::the shard matrix did not expand"
            exit 1
          }

  semantic-carry:
    name: semantic carry, shard ${{ matrix.shard }} of ${{ matrix.shards }}
    needs: plan
    runs-on: ubuntu-latest
    # `fail-fast: false` because one shard dying is one sixteenth of the population, and the other
    # fifteen are worth having: their artifacts merge only if all of them arrive, so a cancelled run
    # wastes the money already spent on the rest.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # The arithmetic, so the ceiling is a hang detector rather than a schedule.
    #
    # A single job over the registered population is 17,900 calls and roughly 2 h 09 m of measured
    # work (run 43590434060), and run 43609290786 showed 32 workers does not shorten it: the time is
    # CPU -- the relevance index over ~493 K characters per corpus, the window render, the
    # per-window supersede scan -- and `Promise.all` overlaps waiting, not arithmetic. So each shard
    # carries 1000/16 = ~63 questions, which is about a sixteenth of that work plus the fixed setup
    # (build, corpus fetch, cache restore) that every job pays.
    #
    # 200 minutes, not 330: a shard that has not finished in 3 h 20 m is not slow, it is stuck, and
    # the merge needs all sixteen rather than most of them.
    timeout-minutes: 200
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gate this workflow did not have. `benchmark-cortex-memory.yml` prices every dispatch
      # through `dispatch-cortex-memory-ab.py`; this workflow was written separately, for a different
      # question, and inherited none of it -- so the one dispatch in this repository that can cost
      # 25-96 CNY was also the one nobody printed a figure for before starting.
      #
      # Before the corpus download, because a dispatch that cannot be afforded should fail in ten
      # seconds rather than after a multi-gigabyte fetch and a build.
      #
      # The projection prices the **whole** dispatch and every shard prints the same figure. That is
      # deliberate: the split divides the work, not the bill, and a per-shard fraction would let
      # sixteen jobs each pass a gate that the dispatch as a whole fails.
      #
      # `limit: 0` is translated here rather than in the tool: it is the workflow's spelling for
      # "everything", and the tool's own `--limit 0` means the zero questions that would price the
      # largest dispatch at nothing. `capability` and `limit` together are refused by the projection
      # (the sampler round-robins), which is the behaviour this step wants -- a wrong input pair has
      # to fail here and not silently price a different run.
      # The pairing's own precondition, and the reason it is checked here rather than in the arm: the arm
      # refuses `pairing=carry` with `semanticCarry` unset, but it cannot refuse a carry run on a pass that
      # never absorbs. `memory.ts` writes a unit only under `reviewPass === 'supersede'`, so `carry` + `bare`
      # administers nothing and publishes `matched: 0` -- which reads as "the layer reached no window" when it
      # is "the layer was never given one". Ten seconds here, as against two hours and 25 CNY of nothing.
      - name: Check the pairing against the pass
        env:
          PAIRING: ${{ inputs.pairing }}
          PASS: ${{ inputs.review_pass }}
          RENDERING: ${{ inputs.turn_rendering }}
        run: |
          if [ "${PAIRING}" = "carry" ] && [ "${RENDERING}" != "head" ]; then
            echo "::error::pairing=carry requires turn_rendering=head: the carry pair holds the rendering"
            echo "::error::at the registered one so the delta is the flag's, and a run that moved the"
            echo "::error::rendering would publish a carry effect measured through a window change."
            exit 1
          fi
          if [ "${PAIRING}" = "carry" ] && [ "${PASS}" != "supersede" ]; then
            echo "::error::pairing=carry requires review_pass=supersede: absorption happens only in that pass,"
            echo "::error::so a carry run under review_pass=${PASS} has nothing to carry and would publish a"
            echo "::error::reach of zero for a mechanism that was never administered."
            exit 1
          fi

      # The rendering, mapped in one place and **fail-closed**. It used to be an expression with a
      # `|| '400'` tail, which meant a misspelled value fell through to the registered rendering and
      # the run became control-against-control: no error, no reading, two hours. The three legal
      # renderings are the three the parser accepts, so a fourth is refused in ten seconds here.
      #
      # `400::match` is the window with the marker it forces; `400:ellipsis` is the head cut with the
      # marker alone, which is the cell that prices the mark without moving a character; `400` is the
      # registered rendering and what an unnamed dispatch sends.
      - name: Map the rendering to the cap string
        env:
          RENDERING: ${{ inputs.turn_rendering }}
        run: |
          set -euo pipefail
          case "${RENDERING}" in
            head)     echo "CORTEX_MEMORY_MAX_TURN_CHARS=400" >> "${GITHUB_ENV}" ;;
            ellipsis) echo "CORTEX_MEMORY_MAX_TURN_CHARS=400:ellipsis" >> "${GITHUB_ENV}" ;;
            match)    echo "CORTEX_MEMORY_MAX_TURN_CHARS=400::match" >> "${GITHUB_ENV}" ;;
            *)
              echo "::error::turn_rendering must be head, ellipsis or match, got '${RENDERING}'."
              echo "::error::The expression this replaced fell through to the registered rendering, so a"
              echo "::error::misspelled value produced control-against-control with no error."
              exit 1
              ;;
          esac

      - name: Check the dispatch against the spend gate
        env:
          LIMIT: ${{ inputs.limit }}
          RUNS: ${{ inputs.ablation_runs }}
          WINDOWS: ${{ inputs.windows }}
          CAPABILITY: ${{ inputs.capability }}
          THINKING: ${{ inputs.thinking }}
          BUDGET: ${{ inputs.budget_cny }}
        run: |
          echo "this job answers shard ${{ matrix.shard }} of ${{ matrix.shards }}; the figure below is the whole dispatch"
          if [ "${CAPABILITY}" = "all" ] || [ -z "${CAPABILITY}" ]; then
            limit="${LIMIT}"
            if [ "${limit}" = "0" ]; then
              limit="$(node -p 'require("./tools/spend-baseline.json").questionCount')"
            fi
            node tools/spend-projection.mjs --report tools/spend-baseline.json \
              --limit "${limit}" --runs "${RUNS}" --windows "${WINDOWS}" \
              --thinking "${THINKING}" --budget "${BUDGET}"
          else
            node tools/spend-projection.mjs --report tools/spend-baseline.json \
              --limit 0 --capability "${CAPABILITY}" --runs "${RUNS}" --windows "${WINDOWS}" \
              --thinking "${THINKING}" --budget "${BUDGET}"
          fi

      - name: Build packages
        run: pnpm build

      - name: Download LongMemEval-S
        run: |
          mkdir -p "${{ github.workspace }}/data"
          curl -fL --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            -o "${{ github.workspace }}/data/longmemeval_s_cleaned.json" \
            "https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json"
          # The digest file, not the corpus: the cache key below reads it, and a missing file hashes
          # to the empty string -- which would resolve to a key that never matches the entry the main
          # benchmark wrote, re-embedding every turn while reporting a miss as normal.
          ACTUAL_SHA="$(sha256sum "${{ github.workspace }}/data/longmemeval_s_cleaned.json" | cut -d' ' -f1)"
          echo "corpus sha256: $ACTUAL_SHA"
          printf '%s  longmemeval_s_cleaned.json\n' "$ACTUAL_SHA" > "${{ github.workspace }}/data/dataset.sha256"

      # The two-window population embeds the same corpus twice per run, so a warm cache is worth more
      # here than on any other arm: the second window's turns are byte-identical to the first's, and
      # the hits are counted as cache hits rather than billed as embeddings.
      - name: Restore embedding cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/data/embedding-cache.bin
          key: longmemeval-embedding-${{ hashFiles('data/dataset.sha256') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            longmemeval-embedding-${{ hashFiles('data/dataset.sha256') }}-
            longmemeval-embedding-

      # The name used to say "two-window carry pair", which stopped being true when `S10` started riding
      # this file and became doubly untrue when `pairing=clock` was added. A step name is the only part of
      # a run an operator reads from the summary page, so a name that describes a smaller experiment than
      # the step runs is the same defect class as an artifact that omits its own configuration.
      - name: Run the paired ablation, this shard
        env:
          LONGMEMEVAL_PATH: ${{ github.workspace }}/data/longmemeval_s_cleaned.json
          EMBEDDING_CACHE_PATH: ${{ github.workspace }}/data/embedding-cache.bin
          LIMIT: ${{ inputs.limit }}
          # arm-config: ABLATION_RUNS departs — a *pair* is two repetitions by construction; the
          # registered four is the confirmation shape, and four here would double the dispatch to
          # answer the same question about two sides of one pass.
          ABLATION_RUNS: ${{ inputs.ablation_runs }}
          TEMPERATURE: '0'
          DEEPSEEK_MODEL: ${{ inputs.model }}
          DEEPSEEK_THINKING: ${{ inputs.thinking }}
          EMBEDDING_BATCH_INTERVAL_MS: '0'
          # §E6's three, and the reason this workflow exists. `AB=carry` builds the baseline from the
          # same constructor as the feature with the carry off; `SEMANTIC_CARRY=1` is what the feature
          # side carries with, and the arm refuses the combination when it is absent.
          CORTEX_MEMORY: '1'
          # `carry` against itself is S12's instrument; `reference` is the arm's registered pair and what
          # S10 measures, where the two sides differ by the turn window rather than by a flag of this class.
          CORTEX_MEMORY_AB: ${{ inputs.pairing }}
          # Set only when the pairing is the carry one. The arm refuses the combination where it is absent,
          # so a `carry` dispatch that forgot this fails before the first call rather than publishing a null
          # result for a comparison that never administered the treatment.
          CORTEX_MEMORY_SEMANTIC_CARRY: ${{ inputs.pairing == 'carry' && '1' || '' }}
          # The other one-flag pair, derived from the pairing rather than from a repository variable. That is
          # the difference between this line and `benchmark-cortex-memory.yml`'s, and it is deliberate: there
          # the clock is a treatment administered on top of the registered pair, so it needs a channel of its
          # own; here the clock IS the pairing, and a second channel would let a dispatch say `pairing=clock`
          # while its treatment was off. The arm's preflight still refuses that combination, because a
          # derivation in a workflow is not a guarantee the arm can see.
          CORTEX_MEMORY_SESSION_CLOCK: ${{ inputs.pairing == 'clock' && 'on' || 'off' }}
          # The third one-flag pair, derived for the same reason the clock above is: here the form IS the
          # pairing, so a second channel would let a dispatch say `pairing=resolution` while its treatment
          # rendered whole turns. `raw` is what the product does when the key is absent, which is why the
          # control side of this pairing and a run that names nothing are the same rendering.
          # `ask` joins `resolution` on the layered side: the ask has never been priced on the
          # rendering that ships, and a pair that measured it on `raw` would be the mistake
          # `RETRACTIONS.md` 28 withdraws, made again with an instrument that cannot be blamed.
          CORTEX_MEMORY_RESOLUTION: ${{ (inputs.pairing == 'resolution' || inputs.pairing == 'ask') && 'layered' || 'raw' }}
          CORTEX_WINDOWS: ${{ inputs.windows }}
          CORTEX_CAPABILITY: ${{ inputs.capability }}
          CORTEX_MEMORY_WORKERS: ${{ inputs.workers }}
          # Which part of the population this job answers. Read together by `readShardPartition`,
          # which refuses one without the other: a count with no index is every job taking shard 0,
          # and an index with no count is every job answering everything.
          CORTEX_SHARD: ${{ matrix.shard }}
          CORTEX_SHARDS: ${{ matrix.shards }}
          # The registered preset, written out here rather than read from the artifact the way
          # `restore-counterfactual.yml` reads a source configuration -- this run is not a
          # counterfactual of another dispatch, it is the dispatch. One departure: `review_pass` is
          # `supersede`, because the carry has nothing to carry without the pass that absorbs.
          CORTEX_MEMORY_THRESHOLD: '0'
          CORTEX_MEMORY_RETRIEVAL_THRESHOLD: '0'
          CORTEX_MEMORY_SESSION_BUDGET: ''
          CORTEX_MEMORY_SOURCE_TRUST: '0.5'
          CORTEX_MEMORY_CONFIDENCE: none
          CORTEX_MEMORY_PROMPT_CONTRACT: evidence-blocks-unsourced
          CORTEX_MEMORY_ASK: ${{ inputs.ask }}
          # arm-config: CORTEX_MEMORY_REVIEW_PASS departs — the carry has nothing to carry without the
          # pass that absorbs, so this file's treatment *is* `supersede`. The claim it tests is that the
          # carry adds nothing on top; the control is this file with `semantic_carry` off.
          CORTEX_MEMORY_REVIEW_PASS: ${{ inputs.review_pass }}
          # Section 7.2's third rendering channel. An input of its own rather than a value of `pairing`,
          # because the pair `carry` produces is the carry's instrument and this is a different experiment:
          # the two sides of a timeline dispatch are both carrying, and differ by whether the served fact is
          # dated. Folding it into `pairing` would have made "the carry does nothing" and "the carry's
          # rendering does nothing" the same dispatch, which is the collapse this campaign spent six rounds
          # undoing for `semanticCarry` itself.
          CORTEX_MEMORY_FACT_TIMELINE: ${{ inputs.fact_timeline }}
          CORTEX_MEMORY_SELF_CONSISTENCY: none
          CORTEX_MEMORY_QUERY_EXPANSION: none
          CORTEX_MEMORY_RELEVANCE: self-index
          CORTEX_MEMORY_RELEVANCE_TOP_K: '256'
          CORTEX_MEMORY_RELEVANCE_UNITS: turn
          # `400` is the registered rendering; `400::match` asks the prompt for the anchored window. One
          # value rather than two variables, because the window is a way of spending the cap and the product
          # refuses it without one -- `readMaxTurnChars` parses the whole decision from this string.
          CORTEX_MEMORY_MAX_TURN_CHARS_ROUTES: multi-session,temporal
          CORTEX_MEMORY_MAX_PROMPT_CHARS: 'abstention:24000,assistant:24000,flat:24000,knowledge-update:24000,multi-session:48460,temporal:24000'
          CORTEX_MEMORY_EVIDENCE_ROLES: user
          CORTEX_MEMORY_EVIDENCE_ROLES_ROUTES: multi-session,temporal
          CORTEX_MEMORY_RERANK: none
          CORTEX_MEMORY_EVIDENCE_TURNS: '256'
        run: pnpm --filter @agentix-e/cortex-memory bench

      # Saved by shard 0 only. Sixteen jobs writing one key race, and the losers log a reservation
      # failure that looks like a defect; the key carries `run_id`, so any one writer is enough and
      # the other fifteen reach the same entry through `restore-keys` on the next run.
      - name: Save embedding cache
        if: always() && matrix.shard == 0
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/data/embedding-cache.bin
          key: longmemeval-embedding-${{ hashFiles('data/dataset.sha256') }}-${{ github.run_id }}-${{ github.run_attempt }}

      # One artifact per shard, named with both numbers so a partial dispatch is visible in the run
      # list without opening anything: `-shard-7-of-16` says what it is and what is missing.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-carry-shard-${{ matrix.shard }}-of-${{ matrix.shards }}
          path: |
            packages/cortex-memory/benchmark-*.md
            packages/cortex-memory/benchmark-*.json
            packages/cortex-memory/benchmark-error.log
          retention-days: 90

      # The reading, printed into the log because the artifact is 20 MB and the three numbers that
      # decide whether the dispatch answered its question are three lines. Printed from the JSON
      # rather than from the Markdown, and with the population beside them: a `matched` without the
      # window count is a count of prompts in a population this job chose.
      #
      # **This is one shard's reading.** Its delta is over ~63 questions and is not `S12`'s; the
      # merged figure is the `merge` job's, and the line printed here says which shard it is so the
      # two cannot be confused in a log a person scrolls.
      - name: Read the reach and the pair, this shard
        if: always()
        run: |
          set -euo pipefail
          REPORT=packages/cortex-memory/benchmark-cortex-memory-ablation-report.json
          test -f "$REPORT" || {
            echo "::warning::no report was written, so there is no reach to read"
            exit 0
          }
          python3 - "$REPORT" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding='utf-8'))
          population = report.get('population')
          carry = report.get('semanticCarry')
          config = report.get('memoryArmConfig', {})
          print(f"population: {population}")
          print(f"reviewPass: {config.get('reviewPass')}  semanticCarry: {config.get('semanticCarry')}")
          print(f"carry census: {carry}")
          # The three states this dispatch can be in, named rather than left to a reader: no census
          # (an older build), a treatment that ran and reached nothing, and a treatment that reached
          # a window. `matched == 0` is a reading; `carry is None` is an instrument that was not there.
          if carry is None:
              print('::warning::the artifact carries no semanticCarry census, so S13 cannot be read')
          elif carry['matched'] == 0:
              print('::warning::absorbed > 0 and matched == 0: the carry reached no window')
          else:
              print(f"reach: {carry['matched']} window(s) carried an absorbed update")
          print(f"delta (feature - baseline), THIS SHARD: {report['ablation']['delta']:+.4f}")
          PY

  # The population, once, from the questions. Sixteen artifacts are not a population, and adding
  # their deltas would be an average of sixteen averages over disjoint samples -- a number that looks
  # like the reading and answers nothing. `tools/merge-ablation.mjs` concatenates the per-question
  # vectors in shard order and sums the censuses; what it cannot honestly recompute it names.
  merge:
    name: merge the shards
    needs: [plan, semantic-carry]
    # `always()` so a failed shard still surfaces the merge's own refusal (a missing shard is named
    # rather than folded away), but the merge only *succeeds* when every shard did.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download every shard
        uses: actions/download-artifact@v4
        with:
          pattern: semantic-carry-shard-*
          path: merged

      - name: Merge into one population
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          mkdir -p merged/out
          node tools/merge-ablation.mjs --dir merged --shards "${SHARDS}" --out merged/out/merged-evidence.json

      - name: Upload the merged evidence
        uses: actions/upload-artifact@v4
        with:
          name: semantic-carry-merged
          path: merged/out/merged-evidence.json
          retention-days: 90

      # The reading the rows actually take, over the whole population: the second-window delta, its
      # discordant counts, and the summed census. Computed from the merged vectors for the reason
      # `semantic_carry_analysis.py` computes it the same way -- the delta is a difference over
      # questions, so it has to be taken from the questions and not from sixteen shard-level deltas.
      #
      # The script is `tools/read-merged-population.py` rather than a heredoc because this step used
      # to require a second window unconditionally, and run 43673528695 -- `S10`'s control arm, one
      # window per corpus by registration -- failed on it after all sixteen shards had succeeded.
      # Inline Python in the workflow could not be tested; a file with a `--windows` contract can.
      - name: Read the merged population
        env:
          WINDOWS: ${{ inputs.windows }}
          PAIRING: ${{ inputs.pairing }}
        run: |
          set -euo pipefail
          python3 tools/read-merged-population.py merged/out/merged-evidence.json \
            --windows "${WINDOWS}" --pairing "${PAIRING}"
