name: Benchmark

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Sample size (0 = full 500-question dataset)'
        required: false
        default: '60'
        type: string
      runs:
        description: 'Number of independent ablation runs'
        required: false
        default: '1'
        type: string
      temperature:
        description: 'Sampling temperature (0 = deterministic)'
        required: false
        default: '0'
        type: string
      diagnostics_limit:
        description: 'Diagnostics sample size (0 = no cap)'
        required: false
        default: '100'
        type: string

permissions:
  contents: read

env:
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  longmemeval-s:
    name: LongMemEval-S natural-language QA ablation
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Verify library
        run: pnpm check

      - name: Download LongMemEval-S
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p "${{ github.workspace }}/data"
          curl -fL --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            -o "${{ github.workspace }}/data/longmemeval_s_cleaned.json" \
            "https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json"

      - name: Restore embedding cache
        id: restore-embedding
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/data/embedding-cache.bin
          key: longmemeval-embedding-${{ hashFiles('data/longmemeval_s_cleaned.json') }}
          restore-keys: |
            longmemeval-embedding-

      - name: Run benchmark
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          LONGMEMEVAL_PATH: ${{ github.workspace }}/data/longmemeval_s_cleaned.json
          EMBEDDING_CACHE_PATH: ${{ github.workspace }}/data/embedding-cache.bin
          ABSTAIN_THRESHOLD: '0.5'
          # Default to a small stratified sample so iterative debugging does not
          # embed the whole ~115k-token haystack for every one of 500 questions
          # on each run. Trigger with limit=0 for the statistically robust
          # full-dataset measurement at milestone checkpoints only.
          TEMPERATURE: ${{ github.event.inputs.temperature || '0' }}
          RUNS: ${{ github.event.inputs.runs || '1' }}
          LIMIT: ${{ github.event.inputs.limit || '60' }}
          DIAGNOSTICS_LIMIT: ${{ github.event.inputs.diagnostics_limit || '100' }}
        run: pnpm --filter @agentix-e/cortex-eval bench

      - name: Save embedding cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/data/embedding-cache.bin
          key: longmemeval-embedding-${{ hashFiles('data/longmemeval_s_cleaned.json') }}

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longmemeval-s-report
          path: |
            packages/cortex-eval/benchmark-report.md
            packages/cortex-eval/benchmark-report.json
            packages/cortex-eval/benchmark-diagnostics.json
            packages/cortex-eval/benchmark-mr-diagnostics.json
            packages/cortex-eval/benchmark-single-session-diagnostics.json
            packages/cortex-eval/benchmark-mr-ablation-report.md
            packages/cortex-eval/benchmark-mr-ablation-report.json
            packages/cortex-eval/benchmark-tr-ablation-report.md
            packages/cortex-eval/benchmark-tr-ablation-report.json
            packages/cortex-eval/benchmark-mr-arithmetic-ablation-report.md
            packages/cortex-eval/benchmark-mr-arithmetic-ablation-report.json
            packages/cortex-eval/benchmark-error.log
          retention-days: 30
