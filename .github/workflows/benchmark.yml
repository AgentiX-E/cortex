name: Benchmark

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Sample size (0 = full 500-question dataset)'
        required: false
        default: '60'
        type: string
      runs:
        description: 'Number of independent runs for the MAIN benchmark'
        required: false
        default: '1'
        type: string
      ablation_runs:
        description: 'Number of runs per ablation (keep at 1: shared answer caches make extra runs redundant)'
        required: false
        default: '1'
        type: string
      temperature:
        description: 'Sampling temperature (0 = deterministic)'
        required: false
        default: '0'
        type: string
      diagnostics_limit:
        description: 'Diagnostics sample size (0 = no cap)'
        required: false
        default: '100'
        type: string
      model:
        description: 'DeepSeek model id (deepseek-chat, deepseek-v4-pro, ...)'
        required: false
        default: 'deepseek-chat'
        type: string
      thinking:
        description: 'Thinking mode: enabled or disabled (default disabled for shallow QA)'
        required: false
        default: 'disabled'
        type: string
      entity_identity_clause:
        description: 'Include the abstention entity-identity sentence (1 = shipped config, 0 = remove it to isolate it from the admission cap)'
        required: false
        default: '1'
        type: string
      candidate_discrimination:
        description: 'Enable candidate-context discrimination in the feature arm (roadmap B7): 1 = on, 0 = shipped behaviour. The reranking A/B is the arm that measures it'
        required: false
        default: '0'
        type: string
      corpus_sha256:
        description: 'Expected SHA-256 of longmemeval_s_cleaned.json (empty = accept whatever the branch serves)'
        required: false
        default: ''
        type: string
      aggregation_critique:
        description: 'Second-pass membership audit on multi-session enumeration questions (0 = off)'
        required: false
        default: '0'
        type: string
      aggregation_critique_mode:
        description: "How the audit finds gaps: 'recall' asks what is missing, 'per-item' numbers every context line and requires a verdict per line"
        required: false
        default: 'recall'
        type: string
      retrieval_sides:
        description: 'Source B7 candidate sides from the retrieved turns (channel C, roadmap B7): 1 = on, 0 = shipped behaviour. Requires candidate_discrimination=1; without it there is no producer to feed'
        required: false
        default: '0'
        type: string
      rerank:
        description: 'Enable the cross-encoder reranking stage (roadmap B1). on = enabled (pick the backend with rerank_provider), off = shipped behaviour. A backend name here is rejected with an error rather than read as off: "local" belongs in rerank_provider'
        required: false
        default: 'off'
        type: string
      rerank_provider:
        description: 'Rerank backend: openai = /rerank convention (needs RERANK_API_KEY), llm = reuse the chat credential, local = offline cross-encoder (no credential)'
        required: false
        default: 'openai'
        type: string
      rerank_candidate_pool:
        description: 'Candidate pool width handed to the reranker (empty = topK). Reranking can only promote what it is shown'
        required: false
        default: ''
        type: string
      rerank_protected_head:
        description: 'Leading hits the reranker may not move (empty = 0). The abstention signal is read from hits[0].score, so pinning it separates reordering from an abstention-rate change'
        required: false
        default: ''
        type: string
      embedding_batch_interval_ms:
        description: 'Minimum spacing between consecutive embedding requests in ms (0 = unpaced). Zhipu throttles on request rate, so a real run should pace'
        required: false
        default: '0'
        type: string

permissions:
  contents: read

env:
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  longmemeval-s:
    name: LongMemEval-S natural-language QA ablation
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The `tools/` Python scripts are part of the delivery path, not scratch
      # work: one publishes to GitHub, one dispatches this workflow, and one makes
      # the resolver usable. `pnpm check` runs their tests, so the interpreter and
      # pytest have to be present before it does.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: python3 -m pip install --requirement tools/requirements-dev.txt

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Verify library
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee check-output.log

      # The job log is served from a host the development sandbox cannot reach,
      # so a failing `Verify library` step reported only "the step exited
      # non-zero". That is enough to know CI is red and not enough to know why,
      # and the run in which this was written cost twelve dispatches to a
      # hypothesis that could not be tested. `if: always()` because the artifact
      # matters precisely when the step above failed; on success it is a few
      # hundred lines of green.
      - name: Upload check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-output
          path: check-output.log
          if-no-files-found: ignore

      - name: Download LongMemEval-S
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Passed through `env` rather than interpolated into the script: a dispatch input is user-controlled, and
          # string interpolation into a shell command is how an input becomes code.
          CORPUS_SHA_INPUT: ${{ github.event.inputs.corpus_sha256 }}
        run: |
          mkdir -p "${{ github.workspace }}/data"
          curl -fL --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            -o "${{ github.workspace }}/data/longmemeval_s_cleaned.json" \
            "https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json"
          # The file is served from a moving branch, so two dispatches can measure two different corpora while
          # both artifacts claim to be "LongMemEval-S / 500". Measured: this is the one candidate that explains a
          # 81.0% -> 44.2% swing without any code change, which is why the hash is printed on every run and can be
          # asserted when a comparison matters.
          ACTUAL_SHA="$(sha256sum "${{ github.workspace }}/data/longmemeval_s_cleaned.json" | cut -d' ' -f1)"
          echo "corpus sha256: $ACTUAL_SHA"
          echo "corpus bytes : $(stat -c%s "${{ github.workspace }}/data/longmemeval_s_cleaned.json")"
          EXPECTED="$CORPUS_SHA_INPUT"
          if [ -n "$EXPECTED" ] && [ "$EXPECTED" != "$ACTUAL_SHA" ]; then
            echo "::error::corpus hash mismatch: expected $EXPECTED, got $ACTUAL_SHA"
            exit 1
          fi

      # The primary key names the entry THIS run will write, and deliberately cannot
      # match anything older -- see the block above `Save embedding cache` at the bottom
      # of this job for the measured audit that forced it.
      - name: Restore embedding cache
        id: restore-embedding
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/data/embedding-cache.bin
          key: longmemeval-embedding-${{ hashFiles('data/longmemeval_s_cleaned.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            longmemeval-embedding-${{ hashFiles('data/longmemeval_s_cleaned.json') }}-
            longmemeval-embedding-

      - name: Run benchmark
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          LONGMEMEVAL_PATH: ${{ github.workspace }}/data/longmemeval_s_cleaned.json
          EMBEDDING_CACHE_PATH: ${{ github.workspace }}/data/embedding-cache.bin
          ABSTAIN_THRESHOLD: '0.5'
          # The entity-identity sentence in the abstention prompt shipped in the
          # same commit as the admission cap, so they are confounded by default.
          # Set to 0 to remove the sentence while keeping the cap, which is the
          # run that attributes the abstention recovery to one or the other.
          # Unset (or any value but 0) keeps the shipped configuration.
          ENTITY_IDENTITY_CLAUSE: ${{ github.event.inputs.entity_identity_clause || '1' }}
          # Roadmap B7. Unlike ENTITY_IDENTITY_CLAUSE above, this defaults OFF and
          # the reader is strict: only '1' switches it on. The two options sit next
          # to each other with opposite defaults on purpose. An unset
          # ENTITY_IDENTITY_CLAUSE means "run the shipped configuration", which has
          # the sentence; an unset CANDIDATE_DISCRIMINATION means "this measurement
          # was not requested", and the feature must be absent for the A/B's control
          # arm to exist. Before this input existed, no dispatch could reach the
          # switch at all.
          CANDIDATE_DISCRIMINATION: ${{ github.event.inputs.candidate_discrimination || '0' }}
          # Roadmap B7, channel C. This input has to exist for the same reason
          # CANDIDATE_DISCRIMINATION does: a switch that no dispatch can set is a
          # switch that cannot be measured, and B7 already lost one round to
          # exactly that (§14: three broken links, the first of which was here).
          # Default '0' keeps the shipped configuration byte-identical for every
          # existing dispatch. It is read only when the annotation producer runs,
          # so setting it without candidate_discrimination=1 changes nothing —
          # that combination is a no-op, not a second control arm.
          RETRIEVAL_SIDES: ${{ github.event.inputs.retrieval_sides || '0' }}
          # The multi-session membership audit. Default '0' keeps every existing dispatch byte-identical, which is
          # the rule this file follows for every switch that costs model calls.
          #
          # The mode matters more than the switch. `recall` asks the model what its own list missed -- an
          # enumeration, and *Judging != Enumerating* (2608.01000) reports enumeration silently stops after a few
          # items. `per-item` numbers every context line and demands one verdict per line, so the decision is made
          # per candidate presented rather than recalled. Two dispatches with the same questions and different
          # modes is the A/B that decides which is true here.
          AGGREGATION_CRITIQUE: ${{ github.event.inputs.aggregation_critique || '0' }}
          AGGREGATION_CRITIQUE_MODE: ${{ github.event.inputs.aggregation_critique_mode || 'recall' }}
          DEEPSEEK_MODEL: ${{ github.event.inputs.model || 'deepseek-chat' }}
          DEEPSEEK_THINKING: ${{ github.event.inputs.thinking || 'disabled' }}
          # Default to a small stratified sample so iterative debugging does not
          # embed the whole ~115k-token haystack for every one of 500 questions
          # on each run. Trigger with limit=0 for the statistically robust
          # full-dataset measurement at milestone checkpoints only.
          TEMPERATURE: ${{ github.event.inputs.temperature || '0' }}
          RUNS: ${{ github.event.inputs.runs || '1' }}
          # Kept separate from RUNS because every ablation shares one answer
          # cache across its two arms, so a second ablation run replays the
          # first run's cached answers and costs full wall-clock for a
          # byte-identical report. Measured on a one-question MR arm: runs=8
          # issues the same 2 uncached calls as runs=1 and its over-run
          # t-test is NaN. Only the main benchmark needs RUNS>1.
          ABLATION_RUNS: ${{ github.event.inputs.ablation_runs || '1' }}
          LIMIT: ${{ github.event.inputs.limit || '60' }}
          DIAGNOSTICS_LIMIT: ${{ github.event.inputs.diagnostics_limit || '100' }}
          # Reranking (roadmap measure B1). These four were previously absent from
          # this file entirely, which meant an operator could set every credential
          # and still have the stage stay off: the values never reached the bench
          # process. The default is 'off', so a dispatch that ignores these inputs
          # reproduces the shipped pipeline exactly.
          CORTEX_RERANK: ${{ github.event.inputs.rerank || 'off' }}
          CORTEX_RERANK_PROVIDER: ${{ github.event.inputs.rerank_provider || 'openai' }}
          RERANK_CANDIDATE_POOL: ${{ github.event.inputs.rerank_candidate_pool }}
          RERANK_PROTECTED_HEAD: ${{ github.event.inputs.rerank_protected_head }}
          # Client-side pacing for the embedding requests. The 429 root-cause
          # audit found the provider throttles on REQUEST RATE and the batch loop
          # issued back-to-back maximum-size requests; pacing keeps the rate under
          # the limit instead of discovering it by rejection. Default 0, so a
          # dispatch that ignores this input reproduces the previous request
          # pattern exactly and the two form a clean A/B.
          EMBEDDING_BATCH_INTERVAL_MS: ${{ github.event.inputs.embedding_batch_interval_ms || '0' }}
          # Only consulted by the openai provider. The llm provider reuses
          # DEEPSEEK_API_KEY (already set above) and the local provider needs no
          # credential at all, so an empty secret does not block those two.
          RERANK_API_KEY: ${{ secrets.RERANK_API_KEY }}
        run: pnpm --filter @agentix-e/cortex-eval bench

      # The key carries the run id, and the restore above matches on the dataset-hash
      # PREFIX -- which is the pattern `actions/cache` documents and the repair for a
      # measured waste.
      #
      # Both of the failed runs of this workflow lost the vectors they had just paid for:
      # `38520676669` and `38566578567` each ended with
      #
      #     Failed to save: Unable to reserve cache with key longmemeval-embedding-<hash>,
      #     another job may be creating this cache.
      #
      # because the save re-used the exact key the restore had asked for. Two runs that
      # write one key contend for it, and the loser's vectors are discarded -- which is the
      # opposite of what the failure path deliberately does (`persistEmbeddingCache` runs
      # on the way out precisely because "a run that dies at question 300 of 500 has still
      # paid for its embeddings").
      #
      # ## What this key change did NOT achieve until 2026-10-17
      #
      # A unique save key cannot contend. But it also did not get read, because the restore
      # above kept asking for the ORIGINAL bare key as its primary key:
      #
      #   cache 7119462708   691 MB   created 2026-08-29   last accessed 2026-10-16
      #   cache 9009810001  1099 MB   created 2026-10-15   last accessed 2026-10-15
      #   cache 9030207266  1100 MB   created 2026-10-16   last accessed 2026-10-16
      #
      # `last_accessed_at == created_at` on every run-keyed entry proves the prefix path
      # had never once run: an entry existed under the bare key, so the primary key HIT,
      # and `actions/cache` consults `restore-keys` only after a miss. Three consecutive
      # runs each restored 170,095 vectors -- the same 170,095 -- and each saved a larger
      # cache that nothing read. Half of every job (1h38m-1h49m of ~3h21m) was spent
      # re-embedding turns the previous run had already paid for, and `38910134192` died
      # of it: 11,476 live embedding requests, then `429` / code 1113 / 余额不足, with no
      # question started.
      #
      # `run_attempt` is in both keys so a re-run resumes from its predecessor: the primary
      # key misses, the prefix resolves to the most recently created entry, and the vectors
      # the failed attempt paid for are the ones it starts from.
      - name: Save embedding cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/data/embedding-cache.bin
          key: longmemeval-embedding-${{ hashFiles('data/longmemeval_s_cleaned.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longmemeval-s-report
          # Glob the whole report set instead of enumerating filenames: an
          # explicit list silently dropped the P3b entity-graph ablation report
          # (it ran, but was never uploaded), which would have made an ablation
          # result unrecoverable had the run been the only record. Any new
          # `benchmark-*.md/json` report is now captured automatically.
          #
          # One package root, and it used to be two. The second was
          # `cortex-memory`'s, because the cognitive arm ran as a step of this job
          # and wrote its artifacts from its own working directory. It now has
          # `benchmark-cortex-memory.yml`, which uploads its own report under the
          # same artifact name -- so listing the root here would claim this job
          # captures a measurement it no longer runs.
          path: |
            packages/cortex-eval/benchmark-*.md
            packages/cortex-eval/benchmark-*.json
            packages/cortex-eval/benchmark-error.log
          retention-days: 30
