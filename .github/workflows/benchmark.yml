name: Benchmark

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Sample size (0 = full 500-question dataset)'
        required: false
        default: '60'
        type: string
      runs:
        description: 'Number of independent runs for the MAIN benchmark'
        required: false
        default: '1'
        type: string
      ablation_runs:
        description: 'Number of runs per ablation (keep at 1: shared answer caches make extra runs redundant)'
        required: false
        default: '1'
        type: string
      temperature:
        description: 'Sampling temperature (0 = deterministic)'
        required: false
        default: '0'
        type: string
      diagnostics_limit:
        description: 'Diagnostics sample size (0 = no cap)'
        required: false
        default: '100'
        type: string
      model:
        description: 'DeepSeek model id (deepseek-chat, deepseek-v4-pro, ...)'
        required: false
        default: 'deepseek-chat'
        type: string
      thinking:
        description: 'Thinking mode: enabled or disabled (default disabled for shallow QA)'
        required: false
        default: 'disabled'
        type: string
      entity_identity_clause:
        description: 'Include the abstention entity-identity sentence (1 = shipped config, 0 = remove it to isolate it from the admission cap)'
        required: false
        default: '1'
        type: string
      candidate_discrimination:
        description: 'Enable candidate-context discrimination in the feature arm (roadmap B7): 1 = on, 0 = shipped behaviour. The reranking A/B is the arm that measures it'
        required: false
        default: '0'
        type: string
      retrieval_sides:
        description: 'Source B7 candidate sides from the retrieved turns (channel C, roadmap B7): 1 = on, 0 = shipped behaviour. Requires candidate_discrimination=1; without it there is no producer to feed'
        required: false
        default: '0'
        type: string
      rerank:
        description: 'Enable the cross-encoder reranking stage (roadmap B1). on = enabled (pick the backend with rerank_provider), off = shipped behaviour. A backend name here is rejected with an error rather than read as off: "local" belongs in rerank_provider'
        required: false
        default: 'off'
        type: string
      rerank_provider:
        description: 'Rerank backend: openai = /rerank convention (needs RERANK_API_KEY), llm = reuse the chat credential, local = offline cross-encoder (no credential)'
        required: false
        default: 'openai'
        type: string
      rerank_candidate_pool:
        description: 'Candidate pool width handed to the reranker (empty = topK). Reranking can only promote what it is shown'
        required: false
        default: ''
        type: string
      rerank_protected_head:
        description: 'Leading hits the reranker may not move (empty = 0). The abstention signal is read from hits[0].score, so pinning it separates reordering from an abstention-rate change'
        required: false
        default: ''
        type: string
      embedding_batch_interval_ms:
        description: 'Minimum spacing between consecutive embedding requests in ms (0 = unpaced). Zhipu throttles on request rate, so a real run should pace'
        required: false
        default: '0'
        type: string
      cortex_memory:
        description: 'Run the cortex-memory A/B (roadmap step 3): 1 = run it, 0 = shipped behaviour. Both sides run in this one job through a single paired ablation call; the pre-registration in docs/PREREGISTRATION-CORTEX-MEMORY-ARM.md fixes the endpoint, the effect size and the stopping rule'
        required: false
        default: '0'
        type: string
      cortex_memory_threshold:
        description: 'Admission threshold for the cortex-memory arm, in [0, 1] (empty = 0, gates open). Above 1 admits nothing, below 0 admits everything, so the range is enforced rather than trusted'
        required: false
        default: ''
        type: string
      cortex_memory_retrieval_threshold:
        description: 'Retrieval threshold for the cortex-memory arm, in [0, 1] (empty = 0, answer whenever anything was admitted). Separate from cortex_memory_threshold because it gates a different decision: whether the admitted evidence is strong enough to ANSWER with, not whether a turn was worth keeping. Run 37094200823 published threshold=0 with an ungated abstention path and scored 6.40%, so the two are now recorded and set independently'
        required: false
        default: ''
        type: string
      cortex_memory_session_budget:
        description: 'Turn budget across all presented sessions for the cortex-memory arm (empty = unbounded)'
        required: false
        default: ''
        type: string
      cortex_memory_source_trust:
        description: 'Source trust stamped on every memory the cortex-memory arm admits, in [0, 1] (empty = 0.5, the value admission.ts hardcoded before the field existed). It is the ceiling of the value function confidence * sourceTrust * (0.5 + 0.5 * recency), so at the 0.5 default the reachable interval is [0, 0.5] and cortex_memory_retrieval_threshold can only be always-open or always-closed -- which is why run 37110579101 reproduced run 37094200823 digit for digit. Raising it to 1 makes threshold > 0.5 reachable'
        required: false
        default: ''
        type: string
      cortex_memory_confidence:
        description: 'Per-turn confidence signal the cortex-memory arm admits with: empty or none = no callback, so every admitted turn carries confidence 1 and the value function is constant for a fixed source trust; length = min(1, turn.length / 2000). This is the input that makes the retrieval interval populated rather than degenerate: without it, source trust alone fixes every admitted turn to one value, so cortex_memory_retrieval_threshold can only ever be always-open or always-closed (see PREREGISTRATION-CORTEX-MEMORY-ARM.md 11). An unrecognised value is REJECTED rather than defaulted to none, because a run dispatched to introduce per-turn variation that silently ran the constant behaviour would publish an artifact reading as evidence that variation does not help'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  longmemeval-s:
    name: LongMemEval-S natural-language QA ablation
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The `tools/` Python scripts are part of the delivery path, not scratch
      # work: one publishes to GitHub, one dispatches this workflow, and one makes
      # the resolver usable. `pnpm check` runs their tests, so the interpreter and
      # pytest have to be present before it does.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: python3 -m pip install --requirement tools/requirements-dev.txt

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Verify library
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee check-output.log

      # The job log is served from a host the development sandbox cannot reach,
      # so a failing `Verify library` step reported only "the step exited
      # non-zero". That is enough to know CI is red and not enough to know why,
      # and the run in which this was written cost twelve dispatches to a
      # hypothesis that could not be tested. `if: always()` because the artifact
      # matters precisely when the step above failed; on success it is a few
      # hundred lines of green.
      - name: Upload check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-output
          path: check-output.log
          if-no-files-found: ignore

      - name: Download LongMemEval-S
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p "${{ github.workspace }}/data"
          curl -fL --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            -o "${{ github.workspace }}/data/longmemeval_s_cleaned.json" \
            "https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json"

      - name: Restore embedding cache
        id: restore-embedding
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/data/embedding-cache.bin
          key: longmemeval-embedding-${{ hashFiles('data/longmemeval_s_cleaned.json') }}
          restore-keys: |
            longmemeval-embedding-

      - name: Run benchmark
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          LONGMEMEVAL_PATH: ${{ github.workspace }}/data/longmemeval_s_cleaned.json
          EMBEDDING_CACHE_PATH: ${{ github.workspace }}/data/embedding-cache.bin
          ABSTAIN_THRESHOLD: '0.5'
          # The entity-identity sentence in the abstention prompt shipped in the
          # same commit as the admission cap, so they are confounded by default.
          # Set to 0 to remove the sentence while keeping the cap, which is the
          # run that attributes the abstention recovery to one or the other.
          # Unset (or any value but 0) keeps the shipped configuration.
          ENTITY_IDENTITY_CLAUSE: ${{ github.event.inputs.entity_identity_clause || '1' }}
          # Roadmap B7. Unlike ENTITY_IDENTITY_CLAUSE above, this defaults OFF and
          # the reader is strict: only '1' switches it on. The two options sit next
          # to each other with opposite defaults on purpose. An unset
          # ENTITY_IDENTITY_CLAUSE means "run the shipped configuration", which has
          # the sentence; an unset CANDIDATE_DISCRIMINATION means "this measurement
          # was not requested", and the feature must be absent for the A/B's control
          # arm to exist. Before this input existed, no dispatch could reach the
          # switch at all.
          CANDIDATE_DISCRIMINATION: ${{ github.event.inputs.candidate_discrimination || '0' }}
          # Roadmap B7, channel C. This input has to exist for the same reason
          # CANDIDATE_DISCRIMINATION does: a switch that no dispatch can set is a
          # switch that cannot be measured, and B7 already lost one round to
          # exactly that (§14: three broken links, the first of which was here).
          # Default '0' keeps the shipped configuration byte-identical for every
          # existing dispatch. It is read only when the annotation producer runs,
          # so setting it without candidate_discrimination=1 changes nothing —
          # that combination is a no-op, not a second control arm.
          RETRIEVAL_SIDES: ${{ github.event.inputs.retrieval_sides || '0' }}
          DEEPSEEK_MODEL: ${{ github.event.inputs.model || 'deepseek-chat' }}
          DEEPSEEK_THINKING: ${{ github.event.inputs.thinking || 'disabled' }}
          # Default to a small stratified sample so iterative debugging does not
          # embed the whole ~115k-token haystack for every one of 500 questions
          # on each run. Trigger with limit=0 for the statistically robust
          # full-dataset measurement at milestone checkpoints only.
          TEMPERATURE: ${{ github.event.inputs.temperature || '0' }}
          RUNS: ${{ github.event.inputs.runs || '1' }}
          # Kept separate from RUNS because every ablation shares one answer
          # cache across its two arms, so a second ablation run replays the
          # first run's cached answers and costs full wall-clock for a
          # byte-identical report. Measured on a one-question MR arm: runs=8
          # issues the same 2 uncached calls as runs=1 and its over-run
          # t-test is NaN. Only the main benchmark needs RUNS>1.
          ABLATION_RUNS: ${{ github.event.inputs.ablation_runs || '1' }}
          LIMIT: ${{ github.event.inputs.limit || '60' }}
          DIAGNOSTICS_LIMIT: ${{ github.event.inputs.diagnostics_limit || '100' }}
          # Reranking (roadmap measure B1). These four were previously absent from
          # this file entirely, which meant an operator could set every credential
          # and still have the stage stay off: the values never reached the bench
          # process. The default is 'off', so a dispatch that ignores these inputs
          # reproduces the shipped pipeline exactly.
          CORTEX_RERANK: ${{ github.event.inputs.rerank || 'off' }}
          CORTEX_RERANK_PROVIDER: ${{ github.event.inputs.rerank_provider || 'openai' }}
          RERANK_CANDIDATE_POOL: ${{ github.event.inputs.rerank_candidate_pool }}
          RERANK_PROTECTED_HEAD: ${{ github.event.inputs.rerank_protected_head }}
          # Client-side pacing for the embedding requests. The 429 root-cause
          # audit found the provider throttles on REQUEST RATE and the batch loop
          # issued back-to-back maximum-size requests; pacing keeps the rate under
          # the limit instead of discovering it by rejection. Default 0, so a
          # dispatch that ignores this input reproduces the previous request
          # pattern exactly and the two form a clean A/B.
          EMBEDDING_BATCH_INTERVAL_MS: ${{ github.event.inputs.embedding_batch_interval_ms || '0' }}
          # Only consulted by the openai provider. The llm provider reuses
          # DEEPSEEK_API_KEY (already set above) and the local provider needs no
          # credential at all, so an empty secret does not block those two.
          RERANK_API_KEY: ${{ secrets.RERANK_API_KEY }}
        run: pnpm --filter @agentix-e/cortex-eval bench

      # The cortex-memory A/B (roadmap step 3). A separate step rather than a branch
      # inside the one above, because the two systems cannot be constructed by the
      # same entry point: `cortex-eval` cannot see `CortexMemory`, and the arrow in
      # the dependency graph runs the other way. `cortex-memory`'s own bench entry
      # builds BOTH sides and calls `runCortexMemoryArm`, which is what keeps the pair
      # inside a single `runAblationReport` call.
      #
      # Its own step also means a failure here cannot take the primary benchmark's
      # artifacts down with it, and the uploaded glob below already captures
      # `benchmark-cortex-memory-ablation-report.{md,json}` by pattern.
      - name: Run cortex-memory A/B
        # `always()` is deliberately NOT used. This arm must not run when the primary
        # benchmark failed: both consume the same embedding cache, and a partial cache
        # from a crashed run would make this arm's numbers depend on where the crash
        # happened. The cost is that a primary failure also loses this arm, which is
        # correct -- a comparison against an unmeasured baseline is not a comparison.
        if: github.event.inputs.cortex_memory == '1'
        env:
          LONGMEMEVAL_PATH: ${{ github.workspace }}/data/longmemeval_s_cleaned.json
          EMBEDDING_CACHE_PATH: ${{ github.workspace }}/data/embedding-cache.bin
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          # Read from the input rather than hardcoded to '1'.
          #
          # The `if:` above and this variable are two statements of the same fact,
          # and a duplicate statement is one that can disagree. Hardcoded, this line
          # says "the arm is on" unconditionally; the arm's own reader is strict
          # (`readToggle`: only the literal `'1'` is on, and a present-but-unrecognised
          # value is OFF), so a future dispatch that flips the toggle's spelling or
          # adds a second gate would have the step run while the arm silently
          # skipped, printing `cortex-memory arm skipped` into a green run -- or the
          # reverse, which is the §13 failure where two arms came out byte-identical
          # and the verdict was about the dispatch rather than the feature.
          #
          # Forwarding it also keeps `CORTEX_MEMORY` reachable from `tools/`, so the
          # dispatch script's `cortex_memory: '1'` is the single place that decides.
          CORTEX_MEMORY: ${{ github.event.inputs.cortex_memory }}
          CORTEX_MEMORY_THRESHOLD: ${{ github.event.inputs.cortex_memory_threshold }}
          CORTEX_MEMORY_RETRIEVAL_THRESHOLD: ${{ github.event.inputs.cortex_memory_retrieval_threshold }}
          CORTEX_MEMORY_SESSION_BUDGET: ${{ github.event.inputs.cortex_memory_session_budget }}
          # The ceiling, forwarded for the same reason as the two thresholds. Note
          # that this variable is what makes the `cortex_memory_retrieval_threshold`
          # input mean anything above 0.5: without it the arm can only express
          # "always answer" and "never answer", so a dispatch that set a midpoint
          # retrieval threshold while silently leaving the ceiling at its default
          # would run a configuration it believes is gated and is not. That is the
          # §7.3 side-channel defect -- the run completes and the artifact describes
          # the intent rather than the code.
          CORTEX_MEMORY_SOURCE_TRUST: ${{ github.event.inputs.cortex_memory_source_trust }}
          # The per-turn confidence signal, and the reason the two variables above
          # are not sufficient on their own. `sourceTrust` raises the CEILING of the
          # value function; it does not vary the value, because a fixed source trust
          # still multiplies a `confidence` of 1 for every admitted turn. The result
          # is a reachable interval that is populated in appearance only -- every
          # threshold inside it is the same experiment. This variable is what supplies
          # the variation, and PREREGISTRATION-CORTEX-MEMORY-ARM.md 11 records that the
          # pair together is what makes a cut mean anything.
          #
          # Forwarded rather than hardcoded, for the reason the toggle above is:
          # `readConfidenceSignal` rejects an unrecognised value, so a dispatch that
          # named a signal while this line was absent would run `none`, complete
          # successfully, and publish an artifact that reads as evidence per-turn
          # variation does not help -- the 7.3 side-channel defect, where the artifact
          # describes the intent rather than the code.
          CORTEX_MEMORY_CONFIDENCE: ${{ github.event.inputs.cortex_memory_confidence }}
          # The pre-registered scale. `limit: 0` is the full 500 questions and
          # `ablation_runs: 4` is the run count the pre-registration fixes; both are
          # read from the same dispatch inputs the job already carries, so a dispatch
          # that sets them at the workflow level cannot disagree with this step.
          #
          # RUNS is deliberately NOT forwarded. The arm reads `ABLATION_RUNS`, not
          # `RUNS`: every ablation shares one answer cache across its two arms, so a
          # second run replays the first run's cached answers and costs full
          # wall-clock for a byte-identical report (`Run benchmark` above records the
          # measurement: `runs: 8` issues the same 2 uncached calls as `runs: 1`).
          # Forwarding RUNS would therefore be an input that looks like a scale knob
          # and is inert.
          LIMIT: ${{ github.event.inputs.limit || '60' }}
          ABLATION_RUNS: ${{ github.event.inputs.ablation_runs || '1' }}
          TEMPERATURE: ${{ github.event.inputs.temperature || '0' }}
          # The reader is shared by both sides, so the model and the thinking mode
          # have to reach this step too. Omitting them would run the arm's two sides
          # on a different reader from the primary benchmark's, which makes the two
          # reports incomparable for the one reason the pre-registration pins.
          DEEPSEEK_MODEL: ${{ github.event.inputs.model || 'deepseek-chat' }}
          DEEPSEEK_THINKING: ${{ github.event.inputs.thinking || 'disabled' }}
          EMBEDDING_BATCH_INTERVAL_MS: ${{ github.event.inputs.embedding_batch_interval_ms || '0' }}
        run: pnpm --filter @agentix-e/cortex-memory bench

      - name: Save embedding cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/data/embedding-cache.bin
          key: longmemeval-embedding-${{ hashFiles('data/longmemeval_s_cleaned.json') }}

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longmemeval-s-report
          # Glob the whole report set instead of enumerating filenames: an
          # explicit list silently dropped the P3b entity-graph ablation report
          # (it ran, but was never uploaded), which would have made an ablation
          # result unrecoverable had the run been the only record. Any new
          # `benchmark-*.md/json` report is now captured automatically.
          #
          # Both package roots are listed because the arm writes its artifacts from
          # `cortex-memory`'s working directory while the primary benchmark writes
          # from `cortex-eval`'s. Capturing only one root is the same mistake as the
          # explicit-filename list this comment describes: the step succeeds, the
          # artifact is absent, and nothing in the run says so. The §5 step is
          # implemented BY this arm, so losing its report loses the measurement.
          path: |
            packages/cortex-eval/benchmark-*.md
            packages/cortex-eval/benchmark-*.json
            packages/cortex-eval/benchmark-error.log
            packages/cortex-memory/benchmark-*.md
            packages/cortex-memory/benchmark-*.json
            packages/cortex-memory/benchmark-error.log
          retention-days: 30
